      ${S.vu ? `<p class="consigne" style="font-size:18px">Qui a trouvé en premier ?</p><div class="choix deux"><button data-a="pt" data-v="p1">${esc(nom("p1"))}</button><button data-a="pt" data-v="p2">${esc(nom("p2"))}</button></div><div class="choix" style="margin-top:10px"><button data-a="pt" data-v="">Personne</button></div>`
        : `<p class="muted petit" style="text-align:center;margin-bottom:12px">Dites vos réponses par message ou en appel, puis révélez.</p><div class="rangee centre"><button class="btn" data-a="voir">Voir la réponse</button></div>`}`;

/* iii. Blind test */
vueDuo("blindtest", {
  init() { const l = melanger(MELODIES.map((_, i) => i)).slice(0, 8); return { l, opts: l.map(b => ({ c: melanger([b].concat(melanger(MELODIES.map((_, i) => i).filter(x => x !== b)).slice(0, 3))) })), i: 0, rep: {}, sc: { p1: 0, p2: 0 } }; },
  rendu(S) {

/* iv. Qui connaît le mieux l'autre ? */
vueDuo("connait", {
  init: () => ({ l: melanger(CONNAIT.map((_, i) => i)).slice(0, 8), i: 0, rep: {}, sc: { p1: 0, p2: 0 }, bonnes: { p1: 0, p2: 0 }, dernier: null }),
  rendu(S) {
    const sujet = S.i % 2 === 0 ? "p1" : "p2", devin = autre(sujet);
    const d = S.dernier ? `<div class="reponse" style="margin-bottom:14px"><small>Manche précédente</small><p>« ${esc(CONNAIT[S.dernier.q])} » ${esc(nom(S.dernier.sujet))} : ${esc(S.dernier.vraie)} · ${esc(nom(autre(S.dernier.sujet)))} : ${esc(S.dernier.devine)} · <b style="color:${S.dernier.ok ? "var(--vert)" : "#e08a96"};font-weight:400">${S.dernier.ok ? "juste" : "raté"}</b></p></div>` : "";
    if (S.etat === "fin") return duoScores(S.sc) + d;
    const rep = S.rep || {}, q = CONNAIT[S.l[S.i]];
    const tous = rep.vraie != null && rep.devine != null;
    let bas = "";
    if (tous) bas = `<div class="revele"><div><small class="muted">${esc(nom(sujet))}</small><h3>${esc(rep.vraie)}</h3></div><span class="or-txt" style="font-family:var(--f-display);font-size:24px">?</span><div><small class="muted">${esc(nom(devin))}</small><h3>${esc(rep.devine)}</h3></div></div>` + (moi === sujet ? `<p class="consigne" style="font-size:18px">C'est juste ?</p><div class="choix deux"><button data-a="juge" data-v="1">Oui, bravo</button><button data-a="juge" data-v="0">Non, raté</button></div>` : attente(sujet).replace("réfléchit", "juge ta réponse"));
    else if ((moi === sujet && rep.vraie != null) || (moi === devin && rep.devine != null)) bas = attente(autre(moi));
    return duoScores(S.sc, devin) + d + `<div class="carte-q"><span class="num">QUESTION ${S.i + 1} / ${S.l.length} · SUR ${esc(nom(sujet).toUpperCase())}</span><p>« ${esc(q)} »</p><div class="rep">${moi === sujet ? "Écris ta vraie réponse, " + esc(nom(devin)) + " va essayer de la deviner." : "Devine ce que " + esc(nom(sujet)) + " va répondre."}</div></div>${bas}`;
  },
  champ(S) {
    const sujet = S.i % 2 === 0 ? "p1" : "p2", rep = S.rep || {}, k = moi === sujet ? "vraie" : "devine";
    if (rep[k] != null) return null;
    return { cle: "connait-" + S.i + "-" + k, html: `<form class="rangee" style="margin-top:6px"><div class="champ" style="flex:1;margin:0"><input maxlength="80" autocomplete="off" placeholder="${k === "vraie" ? "Ma vraie réponse" : "Ma supposition"}" aria-label="Réponse"></div><button class="btn">Valider</button></form>`, envoyer: (S2, v) => majPartie("connait", { rep: { [k]: v } }) };
  },
  resultat: S => S.gagnant ? esc(nom(S.gagnant)) + " connaît le mieux l'autre" : "Vous vous connaissez autant l'un que l'autre",
  actions: {
    juge(S, v) {
      const sujet = S.i % 2 === 0 ? "p1" : "p2", devin = autre(sujet), rep = S.rep || {};
      if (moi !== sujet || rep.vraie == null || rep.devine == null) return;
      const ok = v === "1", sc = Object.assign({}, S.sc), bonnes = Object.assign({}, S.bonnes);
      if (ok) { sc[devin]++; bonnes[devin]++; }
      const S2 = Object.assign({}, S, { i: S.i + 1, rep: {}, sc, bonnes, dernier: { q: S.l[S.i], sujet, vraie: rep.vraie, devine: rep.devine, ok } });
      if (S2.i >= S.l.length) terminer("connait", S2, gagnantDe(sc), () => { if (bonnes.p1 === S.l.length / 2 || bonnes.p2 === S.l.length / 2) stat("connait_parfait"); });
      else ecrirePartie("connait", S2);
    }
  }
});

/* vii. Mots interdits (par écrit) */
const contientInterdit = (txt, mot) => { const t = " " + normaliser(txt) + " "; return mot.some(m => { const n = normaliser(m); return n && (t.includes(" " + n + " ") || (n.length > 4 && t.includes(n.slice(0, n.length - 1)))); }); };
vueDuo("mots", {
  init: () => ({ manche: 0, sc: { p1: 0, p2: 0 }, pioche: melanger(MOTS_INTERDITS.map((_, i) => i)), k: 0, fin: 0, indices: [], essais: [] }),
  rendu(S) {
    if (S.etat === "fin") return duoScores(S.sc);
    const o = S.manche === 0 ? S.hote : autre(S.hote), d = autre(o), mot = MOTS_INTERDITS[S.pioche[S.k % S.pioche.length]];
    if (!S.fin) return duoScores(S.sc, o) + (moi === o ? `<div class="cache"><p>Tu fais deviner des mots à ${esc(nom(d))} en écrivant des indices.<br><span class="muted" style="font-size:16px">60 secondes. Les mots interdits sont bloqués.</span></p><button class="btn" data-a="go">Lancer le chrono</button></div>` : `<div class="cache"><p>${esc(nom(o))} va te faire deviner des mots.<br><span class="muted" style="font-size:16px">Lis ses indices et écris tes propositions.</span></p></div>`);
    const reste = Math.max(0, Math.ceil((S.fin - Date.now()) / 1000));
    return duoScores(S.sc, o) + `<div class="chrono ${reste <= 10 ? "urgent" : ""}" id="ch">${reste}</div>
      ${moi === o ? `<div class="mot-carte"><strong>${esc(mot[0])}</strong><ul>${mot.slice(1).map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : `<p class="consigne" style="font-size:18px">Quel est le mot ?</p>`}
      <div class="liste" style="margin:10px 0">${(S.indices || []).map(x => `<div class="ligne"><span class="pastille">Indice</span><span class="txt">${esc(x)}</span></div>`).join("")}${(S.essais || []).map(x => `<div class="ligne" style="opacity:.75"><span class="pastille">${esc(nom(d))}</span><span class="txt">${esc(x)}</span></div>`).join("")}</div>
      ${moi === o ? `<div class="rangee centre"><button class="btn mini ghost" data-a="passe">Passer ce mot</button></div>` : ""}`;
  },
  champ(S) {
    if (!S.fin) return null;
    const o = S.manche === 0 ? S.hote : autre(S.hote);
    const role = moi === o ? "indice" : "essai";
    return {
      cle: "mots-" + S.manche + "-" + S.fin + "-" + role,
      html: `<form class="rangee" style="margin-top:10px"><div class="champ" style="flex:1;margin:0"><input maxlength="80" autocomplete="off" autocapitalize="off" placeholder="${role === "indice" ? "Écris un indice" : "Ta proposition"}" aria-label="${role}"></div><button class="btn">Envoyer</button></form>`,
      envoyer(S2, v) {
        if (Date.now() > S2.fin) return;
        const mot = MOTS_INTERDITS[S2.pioche[S2.k % S2.pioche.length]];
        if (role === "indice") {
          if (contientInterdit(v, mot)) { toast("Mot interdit", "Reformule ton indice.", "✕"); return; }
          majPartie("mots", { indices: (S2.indices || []).concat([v]).slice(-6) });
        } else {
          if (normaliser(v) === normaliser(mot[0])) { const sc = Object.assign({}, S2.sc); sc[o]++; majPartie("mots", { k: S2.k + 1, indices: [], essais: [], sc }); toast("Trouvé !", mot[0], "✓"); }
          else majPartie("mots", { essais: (S2.essais || []).concat([v]).slice(-4) });
        }
      }
    };
  },
  tic(S, el) {
    if (!S.fin) return;
    const r = Math.max(0, Math.ceil((S.fin - Date.now()) / 1000));
    const c = $("#ch", el); if (c) { c.textContent = r; c.classList.toggle("urgent", r <= 10); }
    if (r <= 0 && !DUO.mots._fin) {
      DUO.mots._fin = S.fin;
      setTimeout(() => {
        const S2 = partie("mots"); if (!S2 || S2.fin !== S.fin || S2.etat !== "jeu") return;
        if (S2.manche === 0) ecrirePartie("mots", Object.assign({}, S2, { manche: 1, fin: 0, indices: [], essais: [], k: S2.k + 1 }));
        else terminer("mots", S2, gagnantDe(S2.sc), () => stat("mots_trouves", S2.sc.p1 + S2.sc.p2));
      }, moi === S.hote ? 200 : 1500);
    }
  },
  resultat: S => (S.gagnant ? esc(nom(S.gagnant)) + " explique le mieux" : "Égalité") + ` · ${S.sc.p1 + S.sc.p2} mots trouvés`,
  actions: {
    go(S) { const o = S.manche === 0 ? S.hote : autre(S.hote); if (moi !== o || S.fin) return; DUO.mots._fin = 0; majPartie("mots", { fin: Date.now() + 60000 }); },
    passe(S) { majPartie("mots", { k: S.k + 1, indices: [], essais: [] }); }
  }
});

/* xii. Puissance 4 à distance */
vueDuo("p4", {
  init: () => ({ g: Array(42).fill(""), tour: rnd(2) ? "p1" : "p2", ligne: [], dernier: -1 }),
  rendu: S => `<p class="consigne">${S.etat === "jeu" ? (S.tour === moi ? `À toi de jouer <i class="p4-pion ${moi}"></i>` : "Au tour de " + esc(nom(S.tour))) : ""}</p>` + p4Plateau(S.g.map(v => v || null), S.ligne, S.dernier, S.etat === "jeu" && S.tour === moi),
  resultat: S => S.gagnant ? esc(nom(S.gagnant)) + " gagne" : "Match nul",
  actions: {
    col(S, v) {
      if (S.tour !== moi) return;
      const g = S.g.map(x => x || null), c = +v, r = p4Ligne(g, c); if (r < 0) return;
      const i = r * P4C + c; g[i] = moi;
      const w = p4Gagne(g, moi), g2 = g.map(x => x || "");
      const S2 = Object.assign({}, S, { g: g2, tour: autre(moi), ligne: w || [], dernier: i });
      if (w) terminer("p4", S2, moi); else if (g.every(Boolean)) terminer("p4", S2, null); else ecrirePartie("p4", S2);
    }
  }
});

/* x. Pierre-Feuille-Ciseaux */
vueDuo("pfc", {
  init: () => ({ sc: { p1: 0, p2: 0 }, manche: 1, choix: {} }),
  rendu(S) {
    const ch = S.choix || {}, tous = ch.p1 != null && ch.p2 != null;
    const t = `<p class="muted petit" style="text-align:center;margin-bottom:10px">Manche ${S.manche} · 3 manches gagnantes</p>`;
    if (S.etat === "fin") return duoScores(S.sc);
    if (tous) {
      const r = (ch.p1 - ch.p2 + 3) % 3;
      return duoScores(S.sc) + t + `<div class="revele"><div>${PFC[ch.p1][1]}<small>${esc(nom("p1"))}</small></div><span class="or-txt" style="font-family:var(--f-display);font-size:26px">vs</span><div>${PFC[ch.p2][1]}<small>${esc(nom("p2"))}</small></div></div><p class="consigne">${r === 0 ? "Égalité" : esc(nom(r === 1 ? "p1" : "p2")) + " gagne la manche"}</p><div class="rangee centre"><button class="btn" data-a="suite">Manche suivante</button></div>`;
    }
    if (ch[moi] != null) return duoScores(S.sc) + t + `<p class="consigne">Tu as joué ${PFC[ch[moi]][0]}</p>` + attente(autre(moi));
    return duoScores(S.sc) + t + `<p class="consigne">Choisis en secret</p><div class="pfc">${PFC.map((p, i) => `<button data-a="ch" data-v="${i}">${p[1]}${p[0]}</button>`).join("")}</div>`;
  },
  resultat: S => resGagnant(S) + ` · ${S.sc.p1} à ${S.sc.p2}`,
  actions: {
    ch(S, v) { if ((S.choix || {})[moi] != null) return; majPartie("pfc", { choix: { [moi]: +v } }); },
    suite(S) {
      const ch = S.choix || {}; if (ch.p1 == null || ch.p2 == null) return;
      const r = (ch.p1 - ch.p2 + 3) % 3, sc = Object.assign({}, S.sc);
      if (r === 1) sc.p1++; if (r === 2) sc.p2++;
      const S2 = Object.assign({}, S, { sc, manche: S.manche + 1, choix: {} });
      if (sc.p1 >= 3 || sc.p2 >= 3) terminer("pfc", S2, gagnantDe(sc)); else ecrirePartie("pfc", S2);
    }
  }
});

vueDuo("nombre", {
  init: () => ({ secret: rnd(100) + 1, tour: rnd(2) ? "p1" : "p2", essais: 0, hist: [] }),
  rendu: S => `<p class="consigne">${S.etat === "fin" ? "Le nombre était " + S.secret : S.tour === moi ? "À toi : propose un nombre entre 1 et 100" : esc(nom(S.tour)) + " cherche…"}</p>
    ${(S.hist || []).length ? `<div class="carte-q"><p>${S.hist[0].n} : c'est <em class="or-txt">${S.hist[0].s === "↑" ? "plus grand" : "plus petit"}</em></p></div><div class="filtres" style="justify-content:center">${S.hist.map(h => `<span class="pastille">${esc(nom(h.p))} · ${h.n} ${h.s}</span>`).join("")}</div>` : ""}
    <p class="muted petit" style="text-align:center;margin-top:10px">Essais : ${S.essais}. Celui qui trouve gagne.</p>`,
  champ(S) {
    if (S.tour !== moi) return null;
    return { cle: "nombre-" + S.essais, html: `<form class="rangee centre" style="margin-top:10px"><div class="champ" style="margin:0;width:140px"><input type="number" inputmode="numeric" min="1" max="100" aria-label="Nombre" style="text-align:center;font-family:var(--f-display);font-size:28px"></div><button class="btn">Proposer</button></form>`,
      envoyer(S2, v) {

        if (n === S2.secret) { terminer("nombre", Object.assign({}, S2, { essais }), moi, () => { if (essais <= 5) stat("nombre_rapide"); }); return; }
        ecrirePartie("nombre", Object.assign({}, S2, { essais, tour: autre(moi), hist: [{ p: moi, n, s: n < S2.secret ? "↑" : "↓" }].concat(S2.hist || []).slice(0, 8) }));
      } };
  },
  resultat: S => esc(nom(S.gagnant)) + " trouve en " + S.essais + " essai" + (S.essais > 1 ? "s" : "")
});

function roueMythos() {
  const cases = ["60", "80", "100", "120", "150", "200", "300", "BOOSTER"];
  const R = 120, r0 = 34, pas = 45;
  const pt = (rr, d) => { const a = (d - 90) * Math.PI / 180; return [(rr * Math.cos(a)).toFixed(1), (rr * Math.sin(a)).toFixed(1)]; };
  return `<svg viewBox="-130 -130 260 260" class="my-roue" aria-label="Les 8 cases de la roue">${cases.map((c, i) => {
    const a0 = i * pas - pas / 2, a1 = a0 + pas, p1 = pt(R, a0), p2 = pt(R, a1), p3 = pt(r0, a1), p4 = pt(r0, a0), t = pt(82, i * pas);
    const boost = c === "BOOSTER";
    return `<path d="M${p1}A${R} ${R} 0 0 1 ${p2}L${p3}A${r0} ${r0} 0 0 0 ${p4}Z" style="fill:${boost ? "var(--or)" : i % 2 ? "var(--violet)" : "var(--violet-2)"};stroke:var(--or)" stroke-width="1"/><text x="${t[0]}" y="${t[1]}" transform="rotate(${i * pas} ${t[0]} ${t[1]})" text-anchor="middle" dominant-baseline="central" font-family="DM Mono, monospace" font-size="${boost ? 10 : 15}" style="fill:${boost ? "#111" : "var(--champagne)"}">${c}</text>`;
  }).join("")}<circle r="${r0}" style="fill:#0c0b0e;stroke:var(--or)" stroke-width="2"/><text text-anchor="middle" dominant-baseline="central" font-family="Cormorant Garamond, serif" font-size="13" style="fill:var(--champagne)">éclats</text></svg>`;
}

}

      encaisser() { const S = duelCourant(), me = S.mode === "bot" ? S.a : moi; const S2 = defendre(S, me, null); if (S2) { duelSel = []; S2.j[me].afk = 0; enregistrerDuel(S2); } },
      abandon() { confirmer("Abandonner le duel ?", () => { const S = clone(duelCourant()), me = S.mode === "bot" ? S.a : moi; finirDuel(S, advDe(S, me)); enregistrerDuel(S); }, "Abandonner"); },
      prendre(id) { const S = partie("mythos"); if (!S || S.etat !== "fin" || S.gagnant !== moi || S.prise) return; const S2 = clone(S); S2.prise = id; myAjout(S.perdant, id, -1); myAjout(S.gagnant, id, 1); ecrirePartie("mythos", S2); sonGain(); toast("Carte gagnée", MY_C[id].nom, "✦"); },
      revanche() { const S = duelCourant(); if (S.mode === "bot") act.bot(); else act.defier(); },
      "quitter-fin"() { const S = duelCourant(); if (S.mode === "bot") duelBot = null; else if (S.etat === "fin" && (S.prise || S.gagnant !== moi || !S.j[S.perdant].deck.length)) majPartie("mythos", { etat: "annule" }); V["my-duel"].maj(el); }
    };
    brancher(z, act);
    this.maj(el);
    const t = setInterval(() => {
      const S = duelCourant(); if (!S || S.etat !== "jeu") return;
      const b = $("#chrono-b", el); if (b) { const r = Math.max(0, S.limite - Date.now()); b.style.width = r / DUREE_ACTION * 100 + "%"; b.classList.toggle("urgent", r < 15000); }
      const doit = S.phase === "attaque" ? S.actif : advDe(S, S.att.par);
      const me = S.mode === "bot" ? S.a : moi;
      if (S.mode === "bot" && doit === "bot") { if (!duelTimerAuto) duelTimerAuto = setTimeout(() => { duelTimerAuto = 0; const S2 = duelCourant(); if (S2 && S2.etat === "jeu" && S2.mode === "bot") { const d2 = S2.phase === "attaque" ? S2.actif : advDe(S2, S2.att.par); if (d2 === "bot") enregistrerDuel(jouerIA(S2, "bot", false)); } }, 1300 + rnd(900)); return; }
      const retard = Date.now() - S.limite;
      if (retard > (doit === me ? 0 : 4000) && S.etat === "jeu") { duelSel = []; enregistrerDuel(jouerIA(S, doit, true)); }
    }, 1000);
    nettoyages.push(() => { clearInterval(t); clearTimeout(duelTimerAuto); duelTimerAuto = 0; });
  },
  maj(el) {
    const z = $("#duel", el); if (!z) return;
    const m = moi || "p1";
    let S = duelCourant();
    if (S && S.mode === "distance" && S.etat === "attente" && !duelInvitValide(S)) S = null;
    if (S && S.mode === "distance" && S.etat === "annule") S = null;
    if (S && S.mode === "distance" && S.etat === "fin" && Date.now() - (S.fin || 0) > 6 * 3600000) S = null;
    if (!S) {
      const o = autre(m);
      z.innerHTML = `${entete("Duels d'arène · /duel", "Détruis <em>la tour adverse</em>", "8 cartes tirées au hasard dans ta collection, une main de 4 cartes, et une tour de 400 PV à protéger. Le gagnant prend une carte du deck du perdant.")}
        ${room ? `<p class="petit" style="display:flex;align-items:center;gap:8px;margin:-8px 0 16px"><span class="led ${autreEnLigne() ? "" : "orange"}"></span>${esc(nom(o))} ${autreEnLigne() ? "est en ligne" : "n'est pas sur le site en ce moment"}</p>` : ""}
        <div class="grille"><div class="vitrine c6"><h3>Défier ${esc(nom(o))}</h3><p class="muted" style="margin-bottom:14px">Chacun joue sur son téléphone. L'invitation expire au bout de 2 minutes. +150 éclats au gagnant, +50 au perdant.</p><button class="btn" data-a="defier" ${mode === "sync" ? "" : "disabled"}>Envoyer le défi</button>${mode === "sync" ? "" : `<p class="muted petit" style="margin-top:8px">Disponible depuis le lien en ligne du site.</p>`}</div>
        <div class="vitrine c6"><h3>Entraînement</h3><p class="muted" style="margin-bottom:14px">Affronte le Gardien des arènes, un bot. +50 éclats si tu gagnes, aucune carte en jeu.</p><button class="btn ghost" data-a="bot">Combattre le bot</button></div></div>
        <div class="vitrine" style="margin-top:16px"><h3>Règles rapides</h3><ul class="regles"><li>Tour<b>400 PV</b></li><li>Élixir<b>départ 5 · max 10 · +3 par tour · +2 si tu passes</b></li><li>Attaquer<b>coûte plus cher que défendre</b></li><li>Bloquer<b>DÉF ≥ ATQ − 5</b></li><li>Riposte parfaite<b>DÉF ≥ ATQ + 15 : 30 % renvoyés</b></li><li>Combo<b>2 cartes du même panthéon : +10 % d'ATQ</b></li><li>Temps<b>90 s par action · 3 oublis = défaite</b></li></ul><a href="#my-guide" class="petit">Toutes les règles dans le guide</a></div>`;
      return;
    }
    if (S.mode === "distance" && S.etat === "attente") {
      z.innerHTML = S.hote === m
        ? `<div class="cache" style="margin-top:20px"><div class="disque tourne" style="width:70px;height:70px"></div><p>Défi envoyé à <em class="or-txt">${esc(nom(autre(m)))}</em>…</p><p class="muted petit">Expire dans ${Math.max(0, Math.ceil((INVIT_DUEL - (Date.now() - S.cree)) / 1000))} s</p><button class="btn ghost" data-a="annuler">Annuler</button></div>`
        : `<div class="cache" style="margin-top:20px"><p><em class="or-txt">${esc(nom(S.hote))}</em> te défie en duel d'arène</p><div class="rangee centre"><button class="btn" data-a="rejoindre">Accepter le duel</button><button class="btn ghost" data-a="annuler">Refuser</button></div></div>`;
      return;
    }
    const cle = (S.mode) + ":" + (S.debut || S.cree);
    if (S.etat === "jeu" && duelIntroVue !== cle && Date.now() - (S.debut || 0) < 6000) { duelIntroVue = cle; introDuel(el, S); }
    if (duelVuN > S.n || duelVuN < 0) duelVuN = S.n;
    const nouveaux = S.ev.filter(e => e.n > duelVuN);
    if (nouveaux.length) duelSel = [];
    z.innerHTML = htmlDuel(S);
    nouveaux.forEach((e, i) => setTimeout(() => animerEv(z, S, e), i * 500));
    duelVuN = S.n;
  }
};

/* ═══════════ LIFE [BETA] : l'île à deux (jeu 3D en plein écran dans un cadre isolé) ═══════════ */
const LIFE_LS = "jrag-life-v1";
V.life = {
  live: false,
  html: () => `<div class="bienvenue"><p class="surtitre">Life · BETA</p><h1 class="or-txt">Notre île</h1><p class="muted">Chargement de l'île…</p></div>`,
  mount() {
    const ancien = document.getElementById("life-cadre"); if (ancien) ancien.remove();
    const f = document.createElement("iframe");
    f.id = "life-cadre"; f.title = "Life"; f.setAttribute("allow", "autoplay");
    f.srcdoc = LIFE_HTML.replace("<script>", "<script>window.ILE_INTEGREE=true;<\/script><script>");
    document.body.appendChild(f); document.body.classList.add("life-ouvert");
    const docs = { monde: null, p1: null, p2: null }, recus = {}, desabos = [];
    let initEnvoye = false, frameOk = false;
    const envoyer = m => { try { f.contentWindow.postMessage(Object.assign({ life: true }, m), "*"); } catch (e) { } };
    const local = () => { try { return JSON.parse(lsGet(LIFE_LS)) || {}; } catch (e) { return {}; } };
    if (mode === "sync" && db) {
      ["monde", "p1", "p2"].forEach(k => {
        const u = db.doc("life/" + k).onSnapshot(s => {
          docs[k] = s.exists ? s.data() : null; recus[k] = true;
          if (initEnvoye) envoyer({ type: k === "monde" ? "monde" : "sim", p: k, d: docs[k] });
          else tenterInit();
        }, () => { recus[k] = true; tenterInit(); });
        if (typeof u === "function") desabos.push(u);
      });
    } else { Object.assign(docs, local()); recus.monde = recus.p1 = recus.p2 = true; }
    /* Marges de sécurité de l'iPhone (encoche, barre d'accueil) mesurées ici et transmises au jeu */
    const sonde = document.createElement("div");
    sonde.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
    document.body.appendChild(sonde);
    const cs = getComputedStyle(sonde), sat = parseFloat(cs.paddingTop) || 0, sab = parseFloat(cs.paddingBottom) || 0; sonde.remove();
    function tenterInit(force) {
      if (initEnvoye || !frameOk) return;
      if (!force && !(recus.monde && recus.p1 && recus.p2)) return;
      initEnvoye = true;
      envoyer({ type: "init", moi: moi || "p1", noms: { p1: nom("p1"), p2: nom("p2") }, monde: docs.monde, p1: docs.p1, p2: docs.p2, sat, sab });
    }
    const surMessage = e => {
      if (e.source !== f.contentWindow) return;
      const m = e.data; if (!m || !m.life) return;
      if (m.type === "pret") { frameOk = true; tenterInit(); setTimeout(() => tenterInit(true), 4000); }
      else if (m.type === "ecrire" && ["monde", "p1", "p2"].includes(m.k)) {
        docs[m.k] = m.d;
        if (mode === "sync" && db) db.doc("life/" + m.k).set(m.d).catch(erreurEcriture);
        else { const o = local(); o[m.k] = m.d; lsSet(LIFE_LS, JSON.stringify(o)); }
      }
      else if (m.type === "quitter") location.hash = "#accueil";
    };
    window.addEventListener("message", surMessage);
    nettoyages.push(() => {
      window.removeEventListener("message", surMessage);
      desabos.forEach(u => { try { u(); } catch (e) { } });
      f.remove(); document.body.classList.remove("life-ouvert");
    });
  }
};

/* ═══════════ DÉMARRAGE ═══════════ */
(function ciel() {
  const cv = $("#ciel"), ctx = cv.getContext("2d"); let et = [], W, H;
  function taille() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    et = []; const n = Math.round(W * H / 11000);
    for (let i = 0; i < n; i++) et.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + .2, p: Math.random() * 6.28, v: Math.random() * .012 + .003, d: Math.random() * .06 + .015, or: Math.random() < .35 });
  }
  let cOr = "212,175,98", cCh = "244,228,176";
  window.__themeChange = () => { const cs = getComputedStyle(document.documentElement); cOr = cs.getPropertyValue("--or-rgb").trim() || cOr; cCh = cs.getPropertyValue("--ch-rgb").trim() || cCh; if (reduit) dessine(); };
  window.__themeChange();
  function dessine() {
    ctx.clearRect(0, 0, W, H);
    for (const e of et) {
      e.p += e.v; e.y -= e.d; if (e.y < -2) { e.y = H + 2; e.x = Math.random() * W; }
      const a = .25 + .55 * (Math.sin(e.p) * .5 + .5);
      ctx.fillStyle = e.or ? "rgba(" + cOr + "," + a + ")" : "rgba(" + cCh + "," + (a * .7) + ")";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
    }
    if (!reduit && !document.hidden) requestAnimationFrame(dessine);
  }
  taille(); dessine();
  window.addEventListener("resize", () => { taille(); if (reduit) dessine(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !reduit) dessine(); });
})();

$("#qui").addEventListener("click", () => { if (window.JRAG_WEB) location.hash = "#reglages"; else if (K().noms) choisirJoueur(() => afficher(false)); });

function initWeb() {
  if (!window.JRAG_WEB || !moi) return;
  if (!K().noms) PK({ noms: Object.assign({}, window.JRAG_PSEUDOS), cree: Date.now() });
  ["p1", "p2"].forEach(p => { if (J(p).gc == null) PJ(p, { gc: 1000, xp: 0, cles: 3, speciaux: 0 }); });
}
(async function demarrer() {
  if (window.JRAG_AUTH) { afficher(true); await window.JRAG_AUTH; moi = window.JRAG_MOI; lsSet("jrag-moi", moi); }
  else chargerLocal();
  afficher(true);
  const sync = initSync();
  if (K().noms) { pret = true; afficher(true); }
  const minuteur = new Promise(r => setTimeout(r, 3500));
  await Promise.race([sync, minuteur]);
  if (!pret) { pret = true; afficher(true); }
  const ok = await sync;
  if (ok) {
    await initCompte();
    await estProprio();
    identifier();
    initWeb();
    if (moi && J(moi).theme && J(moi).theme !== lsGet("jrag-theme")) { appliquerTheme(J(moi).theme); lsSet("jrag-theme", J(moi).theme); }
    if (!moi && K().noms) { fermerModale(true); choisirJoueur(); }
    afficher(false); verifierSucces();
    initPresence();
    C.parties.forEach(S => { if (invitationValide(S)) invitVues.add(S.id + ":" + S.cree); });
    verifierInvitations();
    const relance = () => { if (invitationValide) planifierRendu(); };
    setInterval(relance, 30000);
  } else verifierSucces();
})();

<title>J'ROULE À GAUCHE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --or:#D4AF62; --champagne:#F4E4B0; --or-sombre:#8C6A2C; --or-clair:#fff2c8; --violet:#2A1640; --violet-2:#1a0d29;
  --or-rgb:212,175,98; --voile-rgb:42,22,64; --ch-rgb:244,228,176;
  --noir:#080808; --noir-2:#111013; --ivoire:#E8E2D4; --gris:#9B9385; --feutre:#0C3A28; --rouge:#A3192B; --vert:#58d68d;
  --f-display:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --filet:linear-gradient(90deg,transparent,var(--or) 20%,var(--champagne) 50%,var(--or) 80%,transparent);
  --or-grad:linear-gradient(135deg,var(--or-sombre) 0%,var(--or) 30%,var(--champagne) 50%,var(--or) 70%,var(--or-sombre) 100%);
  color-scheme:dark;
}
:root[data-theme="rose"]{--or:#FF3EA5;--champagne:#FFC7E4;--or-sombre:#9c1d61;--or-clair:#ffe3f2;--violet:#3b0d2c;--violet-2:#24081b;--or-rgb:255,62,165;--voile-rgb:90,12,62;--ch-rgb:255,199,228;--gris:#a8929f}
:root[data-theme="bleu"]{--or:#4FA8FF;--champagne:#CFE7FF;--or-sombre:#1d4f8a;--or-clair:#e8f4ff;--violet:#0f2347;--violet-2:#0a1730;--or-rgb:79,168,255;--voile-rgb:16,40,92;--ch-rgb:207,231,255;--gris:#8f9bab}
:root[data-theme="violet"]{--or:#B57BFF;--champagne:#E8D7FF;--or-sombre:#5b2ea0;--or-clair:#f3eaff;--violet:#2A1640;--violet-2:#1a0d29;--or-rgb:181,123,255;--voile-rgb:62,24,110;--ch-rgb:232,215,255;--gris:#a096ad}
:root[data-theme="emeraude"]{--or:#3FE0A0;--champagne:#C9F7E4;--or-sombre:#167455;--or-clair:#e6fff4;--violet:#0b2b22;--violet-2:#071c16;--or-rgb:63,224,160;--voile-rgb:10,60,45;--ch-rgb:201,247,228;--gris:#8fa69c}
:root[data-theme="rubis"]{--or:#FF3B5C;--champagne:#FFD1DA;--or-sombre:#9a1530;--or-clair:#ffe8ed;--violet:#3a0a16;--violet-2:#22060d;--or-rgb:255,59,92;--voile-rgb:96,12,30;--ch-rgb:255,209,218;--gris:#ab9398}
:root[data-theme="sunset"]{--or:#FF8A3D;--champagne:#FFE1C7;--or-sombre:#a34a12;--or-clair:#fff1e4;--violet:#3d1a0c;--violet-2:#250f07;--or-rgb:255,138,61;--voile-rgb:110,40,14;--ch-rgb:255,225,199;--gris:#ad9c90}
:root[data-theme="lagon"]{--or:#22E5F0;--champagne:#C8FAFD;--or-sombre:#0e7b85;--or-clair:#e6feff;--violet:#082e36;--violet-2:#051d22;--or-rgb:34,229,240;--voile-rgb:8,66,78;--ch-rgb:200,250,253;--gris:#8fa8ab}
/* Plan : écrin noir, or et champagne, voile violet. Application à pages, barre du haut et barre d'onglets en bas sur téléphone. Le casino sur feutre vert. */

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--noir);color:var(--ivoire);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
img,svg{max-width:100%;display:block}
svg:not([viewBox]){aspect-ratio:1;height:auto}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--champagne);outline-offset:3px}
#ciel{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.voile{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(var(--voile-rgb),.8),transparent 70%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(var(--voile-rgb),.5),transparent 70%),radial-gradient(ellipse 50% 40% at 0% 60%,rgba(var(--voile-rgb),.35),transparent 70%);box-shadow:inset 0 0 160px 40px rgba(0,0,0,.85);transition:background .6s}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}

/* Barre */
.barre{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(8,8,8,.78);border-bottom:1px solid rgba(var(--or-rgb),.14)}
.barre .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.monogramme{font-family:var(--f-display);font-size:19px;letter-spacing:.16em;color:var(--champagne);text-decoration:none;white-space:nowrap}
.monogramme b{font-weight:500;background:var(--or-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.barre .droite{display:flex;align-items:center;gap:8px}
.solde{font-family:var(--f-mono);font-size:12px;color:var(--champagne);padding:6px 10px;border:1px solid rgba(var(--or-rgb),.3);white-space:nowrap;text-decoration:none}
.qui{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border:1px solid rgba(var(--or-rgb),.3);background:transparent;cursor:pointer;font-size:13px;color:var(--ivoire)}
.qui i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:14px;background:var(--or-grad);color:var(--noir);font-weight:600}
.liens-haut{display:flex;gap:20px}
.liens-haut a{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--gris)}
.liens-haut a:hover,.liens-haut a.actif{color:var(--champagne)}
@media (max-width:900px){.liens-haut{display:none}}

/* Onglets bas */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;grid-template-columns:repeat(5,1fr);background:rgba(8,8,8,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(var(--or-rgb),.18);padding-bottom:env(safe-area-inset-bottom)}
.onglets a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10px;letter-spacing:.08em;text-decoration:none;color:var(--gris)}
.onglets a svg{width:20px;height:20px}
.onglets a.actif{color:var(--champagne)}
.onglets a.actif svg{color:var(--or)}
@media (max-width:900px){.onglets{display:grid}main{padding-bottom:90px}}

main{position:relative;z-index:1;padding:28px 0 70px;min-height:70vh}
footer{position:relative;z-index:1;padding:30px 0 40px;text-align:center}
footer .filet{width:min(420px,70%);margin:0 auto 22px}
footer p{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;color:var(--champagne)}
footer p span{color:var(--or);margin:0 8px}
@media (max-width:900px){footer{padding-bottom:110px}}

/* Typo */
.surtitre{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--or);font-weight:400}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;text-wrap:balance;line-height:1.08;color:var(--champagne)}
h1{font-size:clamp(38px,7vw,64px);margin:8px 0 10px}
h1 em,h2 em{font-style:italic;color:var(--or)}
h2{font-size:clamp(26px,4vw,34px);margin-bottom:8px}
h3{font-size:22px;font-weight:500;margin-bottom:6px}
.chapo{max-width:62ch;color:var(--gris);font-size:16.5px}
.muted{color:var(--gris)}
.petit{font-size:13px}
.cmd{font-family:var(--f-mono);font-size:12px;color:var(--champagne);background:rgba(var(--or-rgb),.08);border:1px solid rgba(var(--or-rgb),.25);padding:1px 7px;white-space:nowrap}
.filet{height:1px;background:var(--filet);opacity:.7;border:0}
.or-txt{background:var(--or-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tete-page{margin-bottom:26px}
.retour{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);text-decoration:none;margin-bottom:14px;background:none;border:0;cursor:pointer}
.retour:hover{color:var(--champagne)}
.retour svg{width:14px;transform:rotate(90deg)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--noir);background:var(--or-grad);background-size:200% 100%;border:0;cursor:pointer;text-decoration:none;transition:background-position .5s,transform .2s,opacity .2s;box-shadow:0 0 0 1px rgba(var(--ch-rgb),.35),0 8px 30px -12px rgba(var(--or-rgb),.6);font-weight:500;min-height:46px}
.btn:hover{background-position:100% 0}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--champagne);box-shadow:inset 0 0 0 1px rgba(var(--or-rgb),.5)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--champagne)}
.btn.mini{padding:8px 14px;min-height:36px;font-size:11px;letter-spacing:.16em}
.btn.danger{background:transparent;color:#e08a96;box-shadow:inset 0 0 0 1px rgba(224,138,150,.5)}
.rangee{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rangee.centre{justify-content:center}

/* Champs */
.champ{display:grid;gap:6px;margin-bottom:14px}
.champ label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--or)}
.champ input,.champ textarea,.champ select{width:100%;padding:12px 14px;background:rgba(8,8,8,.7);border:1px solid rgba(var(--or-rgb),.25);border-radius:0;color:var(--ivoire);font-size:16px;outline:none;transition:border-color .2s}
.champ input:focus,.champ textarea:focus,.champ select:focus{border-color:var(--or)}
.champ textarea{min-height:110px;resize:vertical}
.case-l{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px;cursor:pointer}
.case-l input{width:18px;height:18px;accent-color:var(--or)}

/* Vitrines */
.vitrine{position:relative;background:linear-gradient(160deg,rgba(var(--voile-rgb),.35),rgba(17,16,19,.92) 45%);border:1px solid rgba(var(--or-rgb),.18);padding:clamp(20px,3.5vw,32px);transition:border-color .4s,box-shadow .4s}
.vitrine::before{content:"";position:absolute;inset:6px;border:1px solid rgba(var(--or-rgb),.06);pointer-events:none}
.vitrine::after{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:var(--filet);opacity:.5}
.grille{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:860px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.pile{display:grid;gap:16px}
.ico{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid rgba(var(--or-rgb),.4);transform:rotate(45deg)}
.ico svg{width:18px;height:18px;transform:rotate(-45deg);color:var(--or)}

/* Tuiles d'accueil */
.tuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.tuiles{grid-template-columns:repeat(2,1fr)}}
.tuile{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px 18px;text-decoration:none;background:linear-gradient(170deg,rgba(var(--voile-rgb),.55),rgba(17,16,19,.92));border:1px solid rgba(var(--or-rgb),.18);transition:border-color .3s,transform .3s,box-shadow .3s;min-height:132px}
.tuile:hover{border-color:var(--or);transform:translateY(-3px);box-shadow:0 20px 50px -30px rgba(var(--or-rgb),.6)}
.tuile:active{transform:scale(.98)}
.tuile > span:last-child{display:grid;gap:4px}
.tuile b{font-family:var(--f-display);font-weight:500;font-size:21px;color:var(--champagne);line-height:1.1}
.tuile small{font-size:12.5px;color:var(--gris);line-height:1.35}
.tuile .badge{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:10px;padding:2px 7px;background:var(--or);color:var(--noir)}
.tuile.vip{grid-column:span 2;background:radial-gradient(ellipse at 30% 0%,#11553a,var(--feutre) 55%,#04140d);border-color:rgba(var(--or-rgb),.45)}
.tuile.vip b{font-size:28px}
@media (max-width:860px){.tuile.vip{grid-column:span 2}}

.bandeaux{display:grid;gap:10px;margin-bottom:22px}
.bandeau{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid rgba(var(--or-rgb),.3);background:linear-gradient(90deg,rgba(var(--or-rgb),.12),rgba(8,8,8,.4));text-decoration:none;font-size:14.5px}
.bandeau svg{width:18px;flex:none;color:var(--or)}
.bandeau b{font-weight:400;color:var(--champagne)}
.bandeau .fl{margin-left:auto;color:var(--or);font-size:18px}

.accueil-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.accueil-hero .duo-nv{display:flex;gap:10px}
.mini-stat{padding:10px 14px;border:1px solid rgba(var(--or-rgb),.2);background:rgba(8,8,8,.5);text-align:center;min-width:92px}
.mini-stat strong{display:block;font-family:var(--f-display);font-weight:500;font-size:24px;color:var(--champagne);line-height:1.1;font-variant-numeric:tabular-nums}
.mini-stat span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}

/* Listes et cartes génériques */
.liste{display:grid;gap:10px}
.ligne{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid rgba(var(--or-rgb),.15);background:rgba(8,8,8,.55)}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-weight:400;color:var(--champagne)}
.ligne .txt small{color:var(--gris);font-size:13px}
.vide{padding:28px;text-align:center;border:1px dashed rgba(var(--or-rgb),.25);color:var(--gris);font-size:15px}
.pastille{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;padding:3px 8px;border:1px solid rgba(var(--or-rgb),.35);color:var(--or);white-space:nowrap}
.pastille.ok{border-color:rgba(88,214,141,.5);color:var(--vert)}

/* Jeux : liste */
.jeux-liste{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.jeux-liste{grid-template-columns:1fr}}
.jeu-l{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid rgba(var(--or-rgb),.18);background:rgba(17,16,19,.85);text-decoration:none;transition:border-color .3s,transform .2s}
.jeu-l:hover{border-color:rgba(var(--or-rgb),.45)}
.jeu-l .btn.mini{min-height:32px;padding:6px 12px}
.jeu-l i{font-family:var(--f-display);font-style:italic;font-size:22px;color:var(--or);min-width:30px}
.jeu-l b{display:block;font-weight:400;color:var(--champagne);font-size:16px}
.jeu-l small{color:var(--gris);font-size:13px}
.jeu-l .nb{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--gris)}

/* Plateau de jeu */
.scene{max-width:640px;margin-inline:auto}
.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:20px}
.score{padding:12px;border:1px solid rgba(var(--or-rgb),.2);text-align:center;background:rgba(8,8,8,.5);transition:border-color .3s,box-shadow .3s}
.score.tour{border-color:var(--or);box-shadow:0 0 24px -8px var(--or)}
.score span{display:block;font-size:12px;letter-spacing:.12em;color:var(--gris);text-transform:uppercase}
.score strong{font-family:var(--f-display);font-size:34px;font-weight:500;color:var(--champagne);line-height:1}
.scores .vs{font-family:var(--f-display);font-style:italic;color:var(--or);font-size:20px}
.consigne{text-align:center;font-family:var(--f-display);font-size:22px;color:var(--champagne);margin-bottom:18px;min-height:1.3em}
.carte-q{padding:26px 22px;border:1px solid rgba(var(--or-rgb),.35);background:radial-gradient(ellipse at top,rgba(var(--voile-rgb),.7),rgba(8,8,8,.7) 70%);text-align:center;margin-bottom:18px}
.carte-q .num{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--or)}
.carte-q p{font-family:var(--f-display);font-size:clamp(22px,4vw,28px);line-height:1.25;color:var(--champagne);margin-top:10px}
.carte-q .rep{margin-top:16px;font-size:16px;color:var(--ivoire)}
.choix{display:grid;gap:10px}
.choix.deux{grid-template-columns:1fr 1fr}
.choix button{padding:16px;border:1px solid rgba(var(--or-rgb),.3);background:rgba(17,16,19,.9);cursor:pointer;font-size:16px;color:var(--ivoire);transition:all .2s;text-align:center}
.choix button:disabled{cursor:default}
.choix button small{font-size:11px}
.choix button:hover{border-color:var(--or);color:var(--champagne)}
.choix button.bon{border-color:var(--vert);background:rgba(88,214,141,.12);color:#c9f5da}
.choix button.faux{border-color:#e08a96;background:rgba(163,25,43,.2)}
.fin{text-align:center;padding:30px 20px;border:1px solid var(--or);background:radial-gradient(ellipse at top,rgba(var(--or-rgb),.15),transparent 70%)}
.fin h2{font-size:34px}
.fin .gain{font-family:var(--f-mono);color:var(--or);font-size:13px;margin:10px 0 20px}
.cache{text-align:center;padding:40px 20px;border:1px dashed rgba(var(--or-rgb),.4)}
.cache p{font-family:var(--f-display);font-size:22px;color:var(--champagne);margin-bottom:18px}

/* Mémoire */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:800px}
.memo button{aspect-ratio:3/4;border:0;background:none;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .45s}
.memo button.vu,.memo button.ok{transform:rotateY(180deg)}
.memo button .f,.memo button .d{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border:1px solid rgba(var(--or-rgb),.4)}
.memo button .d{background:repeating-linear-gradient(45deg,var(--violet) 0 6px,var(--violet-2) 6px 12px)}
.memo button .d::after{content:"";position:absolute;inset:7px;border:1px solid rgba(var(--or-rgb),.5)}
.memo button .f{transform:rotateY(180deg);background:linear-gradient(160deg,#fffdf6,#efe8d6);font-size:clamp(26px,7vw,40px);color:#1a1a1a}
.memo button .f.rg{color:var(--rouge)}
.memo button.ok .f{box-shadow:0 0 0 2px var(--or),0 0 20px -4px var(--or)}

/* Morpion */
.morpion{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto}
.morpion button{aspect-ratio:1;border:1px solid rgba(var(--or-rgb),.35);background:rgba(17,16,19,.9);font-family:var(--f-display);font-size:54px;color:var(--champagne);cursor:pointer;line-height:1}
.morpion button.o{color:var(--or)}
.morpion button.gagne{background:rgba(var(--or-rgb),.2)}

.pfc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pfc button{padding:22px 8px;border:1px solid rgba(var(--or-rgb),.3);background:rgba(17,16,19,.9);cursor:pointer;display:grid;gap:8px;place-items:center;color:var(--ivoire);font-size:14px}
.pfc button svg{width:44px;height:44px;color:var(--or)}
.pfc button:hover{border-color:var(--or)}
.revele{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center;margin:10px 0 20px}
.revele div{padding:16px;border:1px solid rgba(var(--or-rgb),.3)}
.revele svg{width:52px;height:52px;margin:0 auto 6px;color:var(--champagne)}

.chrono{font-family:var(--f-mono);font-size:44px;text-align:center;color:var(--champagne);font-variant-numeric:tabular-nums}
.chrono.urgent{color:#e08a96}
.mot-carte{text-align:center;padding:26px;border:1px solid var(--or);background:rgba(8,8,8,.7);margin:14px 0}
.mot-carte strong{display:block;font-family:var(--f-display);font-size:40px;font-weight:500;color:var(--champagne)}
.mot-carte ul{list-style:none;margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.mot-carte li{font-size:13px;padding:4px 10px;border:1px solid rgba(224,138,150,.5);color:#e8a3ad;text-decoration:line-through}

.disque{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.disque::after{content:"";position:absolute;inset:40px;border-radius:50%;background:var(--or-grad)}
.disque.tourne{animation:tour 1.8s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}

/* Souvenirs, album */
.souvenirs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:700px){.souvenirs{grid-template-columns:1fr}}
.souv{background:#0d0c0f;border:1px solid rgba(var(--or-rgb),.2);padding:14px}
.souv .photo{aspect-ratio:4/3;background:linear-gradient(160deg,#3b2357,#120b1c 70%);overflow:hidden}
.souv .photo img{width:100%;height:100%;object-fit:cover}
.souv time{display:block;font-family:var(--f-mono);font-size:11px;color:var(--or);letter-spacing:.1em;margin-top:12px}
.souv h4{font-size:24px;font-weight:500;margin:2px 0 6px}
.souv p{font-size:14.5px;color:var(--ivoire);white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:600px){.photos{grid-template-columns:repeat(2,1fr)}}
.photos button{aspect-ratio:1;border:1px solid rgba(var(--or-rgb),.18);background:#111;padding:0;cursor:pointer;overflow:hidden;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.photos button:hover img{transform:scale(1.05)}
.photos button span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11px;text-align:left;color:var(--champagne);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filtres button{padding:7px 14px;border:1px solid rgba(var(--or-rgb),.25);background:transparent;cursor:pointer;font-size:13px;color:var(--ivoire)}
.filtres button.actif{background:var(--or);color:var(--noir);border-color:var(--or)}
.apercus{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.apercus img{aspect-ratio:1;object-fit:cover;width:100%;border:1px solid rgba(var(--or-rgb),.3)}

.date-l{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid rgba(var(--or-rgb),.15);background:rgba(8,8,8,.55)}
.date-l .j{min-width:62px;text-align:center;padding:6px;border:1px solid rgba(var(--or-rgb),.35)}
.date-l .j strong{display:block;font-family:var(--f-display);font-size:26px;font-weight:500;color:var(--champagne);line-height:1}
.date-l .j span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.date-l.proche{border-color:var(--or);box-shadow:0 0 22px -10px var(--or)}

/* Surprises */
.coffre-scene{display:grid;place-items:center;padding:6px 0}
.coffre{width:min(250px,75%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.coffre .couvercle{transform-origin:50% 92%;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.coffre .lueur{opacity:0;transition:opacity .9s}
.coffre.ouvert .couvercle{transform:rotate(-16deg) translateY(-12px)}
.coffre.ouvert .lueur{opacity:1}
.coffre.secoue{animation:secoue .5s ease-in-out 2}
@keyframes secoue{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.raretes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rarete{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border:1px solid}
.r1{color:#BFB8A8;border-color:#5a554c}.r2{color:#7FB3E6;border-color:#2d5478}.r3{color:#C48CF0;border-color:#5a2f80}
.r4{color:var(--or);border-color:#7a5f2a;box-shadow:0 0 18px -6px var(--or)}
.r5{color:#ffd9e8;border-color:#b0507a;background:linear-gradient(90deg,rgba(176,80,122,.2),rgba(var(--voile-rgb),.4));box-shadow:0 0 22px -6px #e078a6}
.butin{text-align:center;padding:18px;border:1px solid;margin-top:14px;animation:apparait .6s cubic-bezier(.2,1.4,.4,1)}
.butin strong{display:block;font-family:var(--f-display);font-size:30px;font-weight:500}
@keyframes apparait{from{transform:scale(.6);opacity:0}}
.compteurs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.sous-nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.sous-nav a{flex:none;padding:9px 16px;border:1px solid rgba(var(--or-rgb),.25);text-decoration:none;font-size:13px;color:var(--ivoire);white-space:nowrap}
.sous-nav a.actif{background:var(--or);color:var(--noir);border-color:var(--or)}
.cadeaux-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.cadeaux-g{grid-template-columns:repeat(2,1fr)}}
.cadeau{padding:18px 10px;border:1px solid rgba(var(--or-rgb),.25);background:rgba(17,16,19,.9);text-align:center;cursor:pointer;transition:all .3s;color:var(--ivoire)}
.cadeau:hover,.cadeau.choisi{border-color:var(--or);background:rgba(var(--or-rgb),.08)}
.cadeau .s{font-size:34px;color:var(--or);line-height:1;margin-bottom:8px}
.cadeau b{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:17px;color:var(--champagne);line-height:1.2}
.enveloppe{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid rgba(var(--or-rgb),.25);background:rgba(var(--voile-rgb),.3)}
.enveloppe svg{width:48px;flex:none}
.lettre-ouverte{padding:26px;background:linear-gradient(170deg,#f6efdc,#e6dcc2);color:#2a2118;font-family:var(--f-display);font-size:20px;line-height:1.5;white-space:pre-wrap;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}
.bon{display:flex;align-items:stretch;border:1px dashed var(--or);background:rgba(var(--or-rgb),.05)}
.bon .g{padding:14px 16px;flex:1}
.bon .g b{display:block;font-family:var(--f-display);font-weight:500;font-size:20px;color:var(--champagne)}
.bon .d{display:grid;place-items:center;padding:10px 14px;border-left:1px dashed var(--or)}
.bon.utilise{opacity:.45}

/* Profils */
.profils{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.profils{grid-template-columns:1fr}}
.profil{position:relative;padding:24px;background:linear-gradient(145deg,#1a0f28 0%,#0b0a0d 55%,#1c1408 100%);border:1px solid rgba(var(--or-rgb),.5);box-shadow:0 30px 80px -40px rgba(var(--or-rgb),.4),inset 0 0 60px rgba(var(--voile-rgb),.6);overflow:hidden}
.profil::before{content:"";position:absolute;top:-50%;left:-60%;width:50%;height:200%;background:linear-gradient(90deg,transparent,rgba(var(--ch-rgb),.12),transparent);transform:rotate(20deg);animation:balaie 6s ease-in-out infinite;pointer-events:none}
@keyframes balaie{0%,60%{left:-60%}100%{left:130%}}
.profil .haut{display:flex;gap:16px;align-items:center}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--noir);background:var(--or-grad);box-shadow:0 0 0 2px var(--noir),0 0 0 3px var(--or)}
.profil .nv{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--or)}
.profil .titre{font-family:var(--f-display);font-size:28px;color:var(--champagne);line-height:1.1}
.profil .nom{font-size:14px;color:var(--ivoire)}
.xp{margin:18px 0 6px;height:8px;background:rgba(255,255,255,.06);border:1px solid rgba(var(--or-rgb),.25);position:relative;overflow:hidden}
.xp b{position:absolute;left:0;top:0;bottom:0;background:var(--or-grad);transition:width .8s}
.xp-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--gris);font-variant-numeric:tabular-nums;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(var(--or-rgb),.2);margin-top:18px;border:1px solid rgba(var(--or-rgb),.2)}
.stats div{background:#0e0c11;padding:11px 6px;text-align:center}
.stats strong{display:block;font-family:var(--f-display);font-weight:500;font-size:22px;color:var(--champagne);font-variant-numeric:tabular-nums}
.stats span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.echelle{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media (max-width:700px){.echelle{grid-template-columns:repeat(2,1fr)}}
.echelle li{padding:10px;border:1px solid rgba(var(--or-rgb),.15);font-family:var(--f-display);font-size:17px;color:var(--gris)}
.echelle li small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--gris)}
.echelle li.atteint{color:var(--champagne);border-color:rgba(var(--or-rgb),.5)}

/* Succès */
.succes-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:800px){.succes-g{grid-template-columns:1fr}}
.succ{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid rgba(var(--or-rgb),.12);background:rgba(8,8,8,.5)}
.succ.ok{border-color:rgba(var(--or-rgb),.45);background:linear-gradient(90deg,rgba(var(--or-rgb),.1),rgba(8,8,8,.5))}
.medaille{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:#141217;border:1px dashed rgba(var(--or-rgb),.3);color:var(--gris)}
.succ.ok .medaille{border:0;background:radial-gradient(circle at 35% 30%,var(--or-clair),var(--or) 45%,var(--or-sombre));color:#3a2a0c;box-shadow:0 0 20px -4px rgba(var(--or-rgb),.6)}
.succ.ok.cat-casino .medaille{background:radial-gradient(circle at 35% 30%,#b8f0d0,#1f8a55 45%,#0c3a28);color:#eafff3}
.succ.ok.cat-surprises .medaille{background:radial-gradient(circle at 35% 30%,#e2c4ff,#7a43b0 45%,var(--violet));color:#f4e4ff}
.succ.ok.cat-quotidien .medaille{background:radial-gradient(circle at 35% 30%,#fff,#bdbdc6 45%,#55555e);color:#2b2b30}
.succ b{display:block;font-weight:400;color:var(--champagne);font-size:15px;line-height:1.25}
.succ small{color:var(--gris);font-size:12.5px;line-height:1.3;display:block}
.cat-titre{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 10px;border-bottom:1px solid rgba(var(--or-rgb),.2);padding-bottom:6px}
.cat-titre h3{margin:0}
.progression{height:4px;background:rgba(255,255,255,.07);margin-top:8px}
.progression b{display:block;height:100%;background:var(--or-grad)}

/* Toasts */
.toasts{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
.toast{display:flex;gap:12px;align-items:center;padding:13px 16px;background:rgba(14,12,17,.97);border:1px solid var(--or);box-shadow:0 20px 50px -10px rgba(0,0,0,.8),0 0 30px -10px var(--or);animation:toastIn .5s cubic-bezier(.2,1.3,.4,1);pointer-events:auto;font-size:14.5px}
.toast.sort{animation:toastOut .4s forwards}
.toast .m{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--or-clair),var(--or) 45%,var(--or-sombre));color:#3a2a0c;font-family:var(--f-display)}
.toast small{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--or)}
.toast b{font-family:var(--f-display);font-weight:500;font-size:19px;color:var(--champagne)}
@keyframes toastIn{from{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}

/* Modale */
.modale-fond{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fondu .25s}
@keyframes fondu{from{opacity:0}}
.modale{width:min(480px,100%);max-height:88vh;overflow-y:auto;background:linear-gradient(170deg,#1a0f28,#0d0c10 50%);border:1px solid var(--or);padding:26px 22px;position:relative}
.modale h2{margin-bottom:12px}
.modale .fermer{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--gris);font-size:26px;cursor:pointer;line-height:1;padding:4px}
.lightbox img{max-height:70vh;width:auto;margin:0 auto}

/* Questions du jour */
.qdj{border:1px solid rgba(var(--or-rgb),.35);padding:28px 22px;background:radial-gradient(ellipse at top,rgba(var(--voile-rgb),.7),rgba(8,8,8,.6) 70%);text-align:center}
.qdj blockquote{font-family:var(--f-display);font-style:italic;font-size:clamp(26px,4.5vw,36px);line-height:1.2;color:var(--champagne);margin:14px 0 6px}
.reponse{padding:16px;border-left:3px solid var(--or);background:rgba(8,8,8,.6)}
.reponse small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.reponse p{white-space:pre-wrap}

/* Défis, événements */
.defi{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid rgba(var(--or-rgb),.16);background:rgba(8,8,8,.55)}
.defi .txt{flex:1;font-size:15px}
.defi .qui-fait{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.evt{padding:16px;border-left:3px solid var(--or);background:rgba(var(--voile-rgb),.3);display:grid;gap:8px}
.evt .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.evt b{font-family:var(--f-display);font-weight:500;font-size:22px;color:var(--champagne)}

/* Statut */
.statut{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(var(--or-rgb),.2);border:1px solid rgba(var(--or-rgb),.25)}
.statut div{background:#0c0b0e;padding:20px 16px}
.statut small{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris)}
.statut strong{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:500;font-size:26px;color:var(--champagne);margin-top:6px;font-variant-numeric:tabular-nums}
.led{width:9px;height:9px;border-radius:50%;background:var(--vert);box-shadow:0 0 10px var(--vert);animation:clign 2s ease-in-out infinite}
.led.orange{background:#e0b458;box-shadow:0 0 10px #e0b458}
@keyframes clign{50%{opacity:.35}}
@media (max-width:620px){.statut{grid-template-columns:1fr}}

/* ── CASINO ── */
.casino-fond{position:relative;margin:-28px 0 0;padding:30px 0 40px}
.casino-fond::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 90% 70% at 50% 30%,#11553a 0%,var(--feutre) 45%,#04140d 100%)}
.casino-fond::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.3;background-image:radial-gradient(rgba(0,0,0,.4) 1px,transparent 1px);background-size:4px 4px}
.table{background:rgba(4,20,13,.6);border:1px solid rgba(var(--or-rgb),.35);padding:clamp(18px,3.5vw,30px);position:relative}
.table p{color:#c4cec1}
.casino-nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.casino-nav a{flex:none;padding:9px 16px;border:1px solid rgba(var(--or-rgb),.35);text-decoration:none;font-size:13px;color:var(--champagne);background:rgba(0,0,0,.3);white-space:nowrap}
.casino-nav a.actif{background:var(--or-grad);color:var(--noir);border-color:var(--or)}
.gc-grand{font-family:var(--f-display);font-size:clamp(44px,8vw,64px);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.avertissement{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid rgba(var(--or-rgb),.5);background:rgba(8,8,8,.6);font-size:13.5px;color:var(--ivoire)}
.avertissement svg{width:20px;flex:none;color:var(--or);margin-top:2px}
.regles{list-style:none;display:grid;gap:4px}
.regles li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid rgba(var(--or-rgb),.15);font-size:14.5px;color:#d9ddd2}
.regles li b{font-family:var(--f-mono);font-weight:400;font-size:12.5px;color:var(--champagne);white-space:nowrap}

.jetons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.jeton{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:#fff;position:relative;box-shadow:0 5px 12px -4px rgba(0,0,0,.7);border:0;cursor:pointer;transition:transform .2s}
.jeton::before{content:"";position:absolute;inset:4px;border-radius:50%;border:3px dashed rgba(255,255,255,.85)}
.jeton::after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.jeton span{position:relative;z-index:1}
.jeton:hover{transform:translateY(-3px)}
.jeton.choisi{transform:translateY(-6px);box-shadow:0 0 0 2px var(--champagne),0 10px 20px -6px rgba(0,0,0,.8)}
.jeton:disabled{opacity:.3;cursor:not-allowed}
.j10{background:#3b5c8a}.j50{background:#a3192b}.j100{background:#1d1d1f}.j500{background:#5b2c8a}.j1000{background:#b0892f;color:#1a1206}.j5000{background:radial-gradient(circle at 35% 30%,var(--or-clair),var(--or) 50%,var(--or-sombre));color:#2a1c05}
.j1000::before,.j5000::before{border-color:rgba(26,18,6,.6)}
.mise{text-align:center;margin:12px 0}
.mise strong{font-family:var(--f-display);font-size:34px;font-weight:500;color:var(--champagne)}

/* Blackjack */
.bj-zone{display:grid;gap:22px;min-height:300px}
.bj-rang small{display:flex;gap:10px;align-items:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--or);margin-bottom:10px}
.bj-rang small b{font-family:var(--f-mono);font-weight:400;color:var(--noir);background:var(--champagne);padding:1px 8px;letter-spacing:.02em;font-size:13px}
.cartes{display:flex;min-height:120px}
.carte{width:80px;height:114px;border-radius:7px;background:linear-gradient(160deg,#fffdf6,#efe8d6);box-shadow:0 10px 25px -8px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.2);position:relative;font-family:var(--f-display);font-weight:600;color:#1a1a1a;margin-left:-30px;flex:none;animation:distribue .45s cubic-bezier(.2,.9,.3,1.1) both}
.carte:first-child{margin-left:0}
.carte.rouge{color:var(--rouge)}
.carte .c{position:absolute;top:5px;left:7px;line-height:.9;font-size:21px;text-align:center}
.carte .c span{display:block;font-size:15px}
.carte .c.bas{top:auto;left:auto;bottom:5px;right:7px;transform:rotate(180deg)}
.carte .mil{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
.carte.dos{background:repeating-linear-gradient(45deg,var(--violet) 0 6px,var(--violet-2) 6px 12px);border:3px solid var(--champagne)}
.carte.dos::after{content:"";position:absolute;inset:9px;border:1px solid var(--or)}
@keyframes distribue{from{transform:translate(120px,-140px) rotate(25deg);opacity:0}}
@media (max-width:420px){.carte{width:68px;height:97px;margin-left:-26px}.carte .mil{font-size:32px}.carte .c{font-size:18px}}
.bj-msg{text-align:center;font-family:var(--f-display);font-size:28px;color:var(--champagne);min-height:1.3em}
.bj-msg.gagne{color:var(--or)}

/* Roulette */
.roue{width:min(300px,82vw);aspect-ratio:1;position:relative;margin:0 auto}
.roue svg{width:100%;height:100%;filter:drop-shadow(0 25px 40px rgba(0,0,0,.6))}
.plateau-r{transform-box:fill-box;transform-origin:center}
.roue .fleche{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid var(--champagne);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));z-index:2}
.tapis{display:grid;gap:4px;margin-top:16px}
.tapis button{position:relative;border:1px solid rgba(var(--ch-rgb),.5);color:#fff;font-family:var(--f-display);font-weight:600;font-size:17px;cursor:pointer;padding:0;min-height:40px;display:grid;place-items:center}
.tapis .n-r{background:#8e1525}.tapis .n-n{background:#141414}.tapis .n-v{background:#0f7a45}
.tapis .ext{background:rgba(12,58,40,.9);font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tapis .grille-n{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tapis .rang3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tapis .rang6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
@media (max-width:520px){.tapis .rang6{grid-template-columns:repeat(3,1fr)}}
.tapis .pose{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;border-radius:50%;background:var(--or-grad);color:var(--noir);font-family:var(--f-mono);font-size:9.5px;display:grid;place-items:center;border:2px dashed rgba(8,8,8,.5);z-index:2;padding:0 3px}
.tapis button.gagnant{box-shadow:0 0 0 3px var(--champagne),0 0 20px var(--or);z-index:1}
.resultat-r{text-align:center;font-family:var(--f-display);font-size:24px;color:var(--champagne);min-height:1.5em;margin-top:12px}
.historique-r{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.historique-r span{width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border-radius:50%;color:#fff}

.classement{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.classement th{text-align:left;font-weight:400;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--or);padding:8px 6px;border-bottom:1px solid rgba(var(--or-rgb),.4)}
.classement td{padding:12px 6px;border-bottom:1px solid rgba(var(--or-rgb),.12);color:#dfe3d8}
.classement .num{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.classement td.n{font-family:var(--f-display);font-size:19px;color:var(--champagne)}
.table-scroll{overflow-x:auto}
.histo{display:grid;gap:4px;max-height:420px;overflow-y:auto}
.histo div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(0,0,0,.25);font-size:13.5px}
.histo .plus{color:var(--vert);font-family:var(--f-mono)}
.histo .moins{color:#e08a96;font-family:var(--f-mono)}
.mission{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid rgba(var(--or-rgb),.2);background:rgba(0,0,0,.25)}
.mission .txt{flex:1}
.mission .progression{width:100%}

.bienvenue{max-width:520px;margin:30px auto;text-align:center}
.bienvenue h1{font-size:clamp(44px,10vw,76px)}
.bienvenue .vitrine{text-align:left;margin-top:24px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Accueil en deux portes */
.portes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.portes{grid-template-columns:1fr}}
.porte{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-height:230px;padding:26px 24px;text-decoration:none;border:1px solid rgba(var(--or-rgb),.4);transition:transform .35s,box-shadow .35s,border-color .35s}
.porte:hover{transform:translateY(-3px);border-color:var(--or);box-shadow:0 30px 70px -35px rgba(var(--or-rgb),.7)}
.porte:active{transform:scale(.985)}
.porte.univers{background:radial-gradient(ellipse at 80% 0%,rgba(var(--voile-rgb),.95),rgba(17,16,19,.95) 70%)}
.porte.casino{background:radial-gradient(ellipse at 80% 0%,#11553a,var(--feutre) 50%,#04140d)}
.porte .deco{position:absolute;top:-30px;right:-40px;width:230px;height:230px;opacity:.8;transition:transform 1.2s}
.porte:hover .deco{transform:rotate(25deg) scale(1.05)}
.porte b{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,8vw,50px);line-height:1;color:var(--champagne);position:relative}
.porte small{color:var(--ivoire);opacity:.8;font-size:14px;max-width:34ch;position:relative}
.porte .surtitre{position:relative}
.porte .entrer{position:relative;margin-top:10px;align-self:flex-start;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;padding:10px 18px;background:var(--or-grad);color:var(--noir);font-weight:500}
.raccourcis{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.raccourcis a{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid rgba(var(--or-rgb),.25);text-decoration:none;font-size:13.5px;color:var(--ivoire);background:rgba(8,8,8,.5)}
.raccourcis a svg{width:16px;color:var(--or)}
.raccourcis a:hover{border-color:var(--or);color:var(--champagne)}
a.mini-stat{text-decoration:none;transition:border-color .3s}
a.mini-stat:hover{border-color:var(--or)}

/* Thèmes */
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:700px){.themes{grid-template-columns:repeat(2,1fr)}}
.theme{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid rgba(255,255,255,.12);background:rgba(8,8,8,.6);cursor:pointer;font-size:14px;color:var(--ivoire);text-align:left}
.theme.actif{border-color:var(--or);box-shadow:0 0 20px -6px var(--or)}
.pastille-t{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #080808,0 0 0 3px rgba(255,255,255,.25)}
.etapes{padding-left:20px;display:grid;gap:6px;color:var(--ivoire)}
.etapes b{color:var(--champagne);font-weight:400}

/* Machine à sous */
.slot-cadre{position:relative;padding:18px 14px 16px;border-radius:18px;background:linear-gradient(180deg,#2a1a0b,#120a04);box-shadow:0 0 0 2px var(--or-sombre),0 0 0 5px #0a0603,0 0 0 7px var(--or),0 30px 80px -20px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.8)}
.slot-titre{text-align:center;font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:.12em;margin-bottom:12px}
.slot-ampoules{position:absolute;left:18px;right:18px;top:6px;display:flex;justify-content:space-between}
.slot-ampoules i{width:6px;height:6px;border-radius:50%;background:var(--champagne);box-shadow:0 0 8px var(--or);animation:ampoule 1.2s infinite}
.slot-ampoules i:nth-child(2n){animation-delay:.6s}
@keyframes ampoule{50%{opacity:.25}}
.slot-cadre.gagne .slot-ampoules i{animation-duration:.25s}
.rouleaux{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#050302;padding:5px;border-radius:8px;position:relative}
.rouleau{aspect-ratio:1/3;overflow:hidden;position:relative;border-radius:4px;background:linear-gradient(180deg,#d9d2c0,#fffdf6 18%,#fffdf6 82%,#d9d2c0)}
.rouleau::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 22%,transparent 78%,rgba(0,0,0,.45))}
.bande{position:absolute;left:0;right:0;top:0;will-change:transform}
.case-s{height:var(--h,60px);display:grid;place-items:center;padding:12%}
.case-s svg{width:100%;height:100%}
.case-s.gagne{animation:pulse-s .6s ease-in-out infinite alternate;background:radial-gradient(circle,rgba(var(--or-rgb),.55),transparent 70%)}
@keyframes pulse-s{to{transform:scale(1.12)}}
.rouleau.flou .bande{filter:blur(1.2px)}
.slot-ecran{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}

.fs-bandeau{text-align:center;padding:8px;margin-bottom:10px;background:linear-gradient(90deg,transparent,rgba(var(--or-rgb),.35),transparent);font-family:var(--f-display);font-size:20px;color:var(--champagne);letter-spacing:.06em}

.table-gains{display:grid;gap:6px}

/* Table de blackjack */
.bj-table{position:relative;margin:0 auto;max-width:640px;min-height:540px;padding:22px 16px 120px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:radial-gradient(ellipse 80% 70% at 50% 35%,#16704a 0%,#0e5536 45%,#073220 100%);
  border-radius:14px 14px 50% 50% / 14px 14px 26% 26%;
  box-shadow:0 0 0 2px var(--or-sombre),0 0 0 14px #3a2210,0 0 0 15px #6b4320,0 0 0 17px var(--or),0 40px 80px -30px rgba(0,0,0,.95),inset 0 0 80px rgba(0,0,0,.55);margin-top:22px;margin-bottom:34px}
.bj-table::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.25;background-image:radial-gradient(rgba(0,0,0,.5) 1px,transparent 1px);background-size:4px 4px;pointer-events:none}

.sabot-boite{position:relative;width:62px;height:74px;border-radius:6px 6px 4px 4px;background:linear-gradient(160deg,#3a2210,#1a0e05);box-shadow:0 0 0 1px var(--or),0 10px 20px -6px rgba(0,0,0,.8);transform:perspective(200px) rotateX(18deg)}
.sabot-boite i{position:absolute;left:8px;right:8px;height:52px;bottom:8px;border-radius:4px;background:repeating-linear-gradient(45deg,var(--violet) 0 4px,var(--violet-2) 4px 8px);border:2px solid var(--champagne)}

.sabot-boite b{position:absolute;left:4px;right:4px;bottom:0;height:16px;background:linear-gradient(180deg,#5a3618,#2a160a);border-radius:0 0 4px 4px;border-top:1px solid var(--or)}
.bj-sabot small{font-family:var(--f-mono);font-size:9.5px;color:var(--champagne);opacity:.8}
.bj-zone{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:132px;justify-content:center;z-index:1}
.bj-cartes{display:flex;justify-content:center;min-height:112px}
.bj-total{font-family:var(--f-mono);font-size:13px;padding:2px 10px;background:rgba(0,0,0,.55);color:var(--champagne);border:1px solid rgba(var(--or-rgb),.5);border-radius:20px;min-width:38px;text-align:center;visibility:hidden}
.bj-total.vis{visibility:visible}
.carte-bj{width:76px;height:108px;margin-left:-34px;flex:none;perspective:600px}
.carte-bj:first-child{margin-left:0}
.carte-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.carte-bj.cachee .carte-in{transform:rotateY(180deg)}
.carte-bj .face{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 8px 18px -6px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25)}
.carte-bj .avant{background:linear-gradient(160deg,#fffdf6,#efe8d6);font-family:var(--f-display);font-weight:600;color:#1a1a1a}

.carte-bj .avant .c span{display:block;font-size:14px}
.carte-bj .avant .c.bas{top:auto;left:auto;bottom:5px;right:7px;transform:rotate(180deg)}
.carte-bj .avant .mil{position:absolute;inset:0;display:grid;place-items:center;font-size:38px}
.carte-bj .dos{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--violet) 0 6px,var(--violet-2) 6px 12px);border:3px solid var(--champagne)}
.carte-bj .dos::after{content:"";position:absolute;inset:8px;border:1px solid var(--or);border-radius:3px}
@media (max-width:420px){.carte-bj{width:64px;height:92px;margin-left:-28px}.carte-bj .avant .mil{font-size:30px}.carte-bj .avant .c{font-size:17px}}
.bj-arc{width:min(360px,92%);height:auto;margin:-6px 0 -18px;overflow:visible}
.bj-arc text{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.18em;fill:var(--champagne);opacity:.85}
.bj-regle{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(var(--ch-rgb),.6);margin:0 0 4px;text-align:center}
.bj-rond{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;border:2px solid rgba(var(--ch-rgb),.75);background:radial-gradient(circle,rgba(0,0,0,.18),rgba(0,0,0,.05));box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),0 0 0 4px rgba(var(--ch-rgb),.12);cursor:pointer;display:grid;place-items:center;padding:0}

.jeton-p{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-style:normal;color:#fff;transform:translateY(calc(var(--i, 0) * -4px));box-shadow:0 3px 0 rgba(0,0,0,.35),0 4px 8px -2px rgba(0,0,0,.7)}
.jeton-p::before{content:"";position:absolute;inset:3px;border-radius:50%;border:3px dashed rgba(255,255,255,.85)}
.jeton-p span{position:relative}
.jeton-p.volant{position:fixed;z-index:60;pointer-events:none;transform:none}

.bj-msg span{font-family:var(--f-display);font-size:clamp(24px,6vw,32px);color:var(--champagne);background:rgba(4,20,13,.85);border:1px solid rgba(var(--or-rgb),.6);padding:8px 20px;animation:apparait .45s cubic-bezier(.2,1.4,.4,1);text-align:center}
.bj-msg span.gagne{color:var(--or);border-color:var(--or);box-shadow:0 0 30px -6px var(--or)}
.bj-panneau{max-width:640px;margin:0 auto;padding:16px;background:rgba(4,20,13,.7);border:1px solid rgba(var(--or-rgb),.35)}
.bj-ligne{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bj-son{background:none;border:1px solid rgba(var(--or-rgb),.35);color:var(--champagne);font-size:12px;padding:5px 10px;cursor:pointer}
.bj-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bj-actions .btn{padding:13px 6px;letter-spacing:.14em}
select.sel-biais{padding:8px;background:#0c0b0e;border:1px solid rgba(var(--or-rgb),.3);color:var(--ivoire);font-size:14px;width:100%}

.my-test .case-l{grid-column:1 / -1}
.my-verdict small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--gris);margin-bottom:6px}
.my-verdict p{padding:14px 16px;border-left:3px solid;font-size:15.5px}
.my-verdict .parfait{border-color:var(--or);background:rgba(var(--or-rgb),.12);color:var(--champagne)}
.my-verdict .bloque{border-color:var(--vert);background:rgba(88,214,141,.08)}
.my-verdict .encaisse{border-color:#e08a96;background:rgba(163,25,43,.15)}
.my-boutons-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.my-boutons-acc span{padding:9px 14px;border:1px solid rgba(var(--or-rgb),.3);font-size:14px;background:rgba(8,8,8,.6)}
.my-boutons-acc span.principal{background:var(--or-grad);color:var(--noir);border-color:transparent;font-weight:500}
.my-cmds td:last-child{color:var(--ivoire)}

/* ═══ MYTHOS : cartes ═══ */
.myc{--w:140px;width:var(--w);aspect-ratio:5/7;font-size:calc(var(--w) / 14);border-radius:.8em;padding:.32em;position:relative;flex:none;background:linear-gradient(145deg,#9a9aa4,#e6e6ee 45%,#7d7d88);box-shadow:0 .9em 1.8em -.8em rgba(0,0,0,.85);overflow:hidden;color:#f5efe0;text-align:left}
.myc.rr{background:linear-gradient(145deg,#2b5ea8,#9fd0ff 45%,#1f467d)}
.myc.re{background:linear-gradient(145deg,#5b2ea0,#e2c4ff 45%,#40207a)}
.myc.rl{background:linear-gradient(145deg,#8C6A2C,#fff2c8 45%,#b8862b);box-shadow:0 .9em 1.8em -.8em rgba(0,0,0,.85),0 0 1.4em -.3em rgba(255,210,110,.6)}
.myc.rm{background:linear-gradient(120deg,#ff6ad5,#ffd36b,#6af2ff,#b47bff,#ff6ad5);background-size:300% 300%;animation:prisme 4s linear infinite;box-shadow:0 .9em 1.8em -.8em rgba(0,0,0,.85),0 0 1.8em -.2em rgba(255,140,220,.65)}
@keyframes prisme{to{background-position:300% 0}}
.myc-in{height:100%;border-radius:.55em;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto auto auto auto auto;background:radial-gradient(ellipse at 50% 30%,var(--c1),var(--c2) 75%);position:relative}
.myc-tete{display:flex;align-items:center;gap:.35em;padding:.35em .45em;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.2))}
.myc-tete b{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.25em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff8e6}
.myc-cout{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85em;background:radial-gradient(circle at 35% 30%,#f3d0ff,#a34bd8 55%,#4b1673);color:#fff;flex:none;box-shadow:0 0 .4em rgba(200,120,255,.7)}
.myc-emb{width:1.3em;height:1.3em;color:var(--acc);flex:none}
.myc-art{position:relative;display:grid;place-items:center;overflow:hidden;margin:0 .35em;border-radius:.35em;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.22),transparent 60%),repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.06) 0 6deg,transparent 6deg 18deg);box-shadow:inset 0 0 1.2em rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18)}
.myc-fond{position:absolute;width:85%;height:85%;color:var(--acc);opacity:.22}
.myc-mono{position:relative;font-family:var(--f-display);font-weight:600;font-size:4.4em;line-height:1;background:linear-gradient(180deg,#fff,var(--acc) 60%,var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .08em .18em rgba(0,0,0,.6))}
.myc-nb{position:absolute;top:.3em;right:.3em;font-family:var(--f-mono);font-size:.8em;padding:.1em .45em;background:rgba(0,0,0,.65);border-radius:1em;color:#fff}
.myc-titre{font-family:var(--f-display);font-style:italic;font-size:.9em;text-align:center;padding:.25em .3em 0;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.myc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.2em;padding:.25em .4em}
.myc-stats span{text-align:center;font-family:var(--f-mono);font-size:.95em;background:rgba(0,0,0,.45);border-radius:.3em;padding:.12em 0;line-height:1.1}
.myc-stats i{display:block;font-style:normal;font-size:.55em;letter-spacing:.1em;opacity:.75}
.myc-cap{font-size:.62em;line-height:1.25;padding:.15em .55em;color:#f3ead6}
.myc-cap b{color:var(--acc);font-weight:500}
.myc-leg{font-family:var(--f-display);font-style:italic;font-size:.62em;line-height:1.2;padding:.1em .55em .2em;color:rgba(255,248,230,.65)}
.myc-rar{text-align:center;font-size:.55em;letter-spacing:.24em;text-transform:uppercase;padding:.25em;background:rgba(0,0,0,.45)}
.myc.mini .myc-cap,.myc.mini .myc-leg,.myc.mini .myc-titre{display:none}
.myc.mini .myc-tete b{font-size:1.15em}
.myc.holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 25%,rgba(255,120,220,.35) 38%,rgba(120,220,255,.35) 48%,rgba(255,240,140,.35) 58%,transparent 72%);background-size:260% 260%;mix-blend-mode:screen;animation:holo 3.2s linear infinite}
.myc.verrou{background:linear-gradient(145deg,#2a2730,#3a3642)}
.myc.verrou .myc-in{display:grid;place-items:center;grid-template-rows:1fr auto;background:repeating-linear-gradient(45deg,#15131a 0 .5em,#1b1922 .5em 1em);padding:.5em}
.myc-lock{position:relative;display:grid;place-items:center;width:70%}
.myc-lock svg{width:100%;color:var(--c1);opacity:.3}
.myc-lock span{position:absolute;font-family:var(--f-display);font-size:3em;color:rgba(255,255,255,.35)}
.myc.verrou small{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:#8a8494}
.myc.dos{background:var(--or-grad)}
.myc.dos .myc-in{display:grid;place-items:center;grid-template-rows:1fr auto;background:radial-gradient(circle,var(--violet),var(--violet-2) 70%);padding:12% 0}
.myc.dos svg{width:58%;color:var(--or);opacity:.85}
.myc.dos b{font-family:var(--f-display);font-size:1.3em;letter-spacing:.3em;color:var(--champagne)}
[data-c]{cursor:pointer;transition:transform .25s}
[data-c]:hover{transform:translateY(-4px) rotate(-1deg)}

/* Hub */
.my-hub-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.my-titre.petit{margin:4px 0 0;align-items:flex-start}
.my-titre.petit span{font-size:clamp(48px,11vw,70px)}
.my-tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.my-tuiles.secondaires{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.my-tuiles{grid-template-columns:1fr 1fr}.my-tuiles.secondaires{grid-template-columns:1fr 1fr}}
.my-tuile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:104px;padding:16px;text-decoration:none;text-align:left;border:1px solid rgba(var(--or-rgb),.25);background:linear-gradient(165deg,rgba(var(--voile-rgb),.6),rgba(17,16,19,.95));cursor:pointer;transition:border-color .3s,transform .25s;color:var(--ivoire);font:inherit}
.my-tuile:hover{border-color:var(--or);transform:translateY(-2px)}
.my-tuile b{font-family:var(--f-display);font-size:24px;font-weight:500;color:var(--champagne);line-height:1}
.my-tuile small{font-size:12.5px;color:var(--gris)}
.my-tuile.grand{grid-column:span 1;min-height:150px}
.my-tuile.booster{background:radial-gradient(ellipse at 70% 10%,rgba(143,123,255,.45),rgba(17,16,19,.95) 70%)}
.my-tuile.duel{background:radial-gradient(ellipse at 70% 10%,rgba(224,71,90,.4),rgba(17,16,19,.95) 70%)}
.my-tuiles.secondaires .my-tuile{min-height:78px}
.my-tuiles.secondaires .my-tuile b{font-size:19px}
.my-badge{position:absolute;top:10px;right:10px;font-family:var(--f-mono);font-size:10.5px;padding:2px 8px;background:var(--or);color:var(--noir);border-radius:20px}
.my-barre-s{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 16px}
.my-barre-s span{font-size:12.5px;padding:5px 10px;border:1px solid rgba(var(--or-rgb),.25);background:rgba(8,8,8,.5)}
.my-eclats{color:var(--champagne);font-family:var(--f-mono)}
.my-eclats small{font-family:var(--f-body);color:var(--gris)}

/* Boutique */
.boutique{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.b-item{display:grid;justify-items:center;gap:10px;padding:14px 10px;border:1px solid rgba(var(--or-rgb),.18);background:rgba(17,16,19,.85)}
.b-info{display:grid;gap:4px;text-align:center;justify-items:center}
.b-info b{font-family:var(--f-display);font-size:18px;font-weight:500;color:var(--champagne);line-height:1.1}
.b-info small{font-size:12px;color:var(--gris);min-height:2.4em}
.pack{position:relative;width:118px;height:168px;border-radius:8px 8px 6px 6px;overflow:hidden;display:grid;justify-items:center;align-content:center;gap:6px;background:linear-gradient(160deg,var(--c1),var(--c2) 70%);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 14px 26px -10px rgba(0,0,0,.9);color:var(--acc);transition:transform .3s}
.b-item:hover .pack{transform:translateY(-4px) rotate(-2deg)}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.pack::before{top:0}.pack::after{bottom:0}
.pack-haut{font-family:var(--f-display);font-weight:600;letter-spacing:.32em;font-size:13px;color:#fff8e6}
.pack-emb{width:54px;height:54px;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.pack b{font-family:var(--f-display);font-size:16px;font-weight:600;color:#fff;text-align:center;padding:0 6px;line-height:1.1}
.pack small{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.pack-brille{position:absolute;top:-50%;left:-80%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg);animation:balaie 4s ease-in-out infinite}

/* Ouverture */
.ouverture{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at center,rgba(var(--voile-rgb),.55),transparent 70%),#050407;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;animation:fondu .3s}
.ouverture.sort{animation:fondu .3s reverse forwards}
.ouv-rayons{position:absolute;left:50%;top:45%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,rgba(var(--or-rgb),.16) 0 8deg,transparent 8deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:tour 18s linear infinite;pointer-events:none}
.ouverture.r-L .ouv-rayons{background:repeating-conic-gradient(from 0deg,rgba(255,210,110,.32) 0 8deg,transparent 8deg 20deg)}
.ouverture.r-M .ouv-rayons{background:repeating-conic-gradient(from 0deg,rgba(255,120,220,.3) 0 6deg,rgba(120,230,255,.25) 6deg 12deg,transparent 12deg 20deg)}
.ouverture.r-E .ouv-rayons{background:repeating-conic-gradient(from 0deg,rgba(196,140,240,.28) 0 8deg,transparent 8deg 20deg)}
.ouv-scene{position:relative;z-index:1;min-height:260px;display:grid;place-items:center}
.ouv-pack .pack{width:150px;height:214px;animation:tremble 1.5s ease-in forwards}
.ouv-pack .pack-emb{width:70px;height:70px}
@keyframes tremble{0%{transform:scale(.6) rotate(-8deg);opacity:0}15%{transform:scale(1) rotate(0);opacity:1}40%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}60%{transform:rotate(-3deg) scale(1.03)}70%{transform:rotate(3deg) scale(1.05)}80%{transform:rotate(-4deg) scale(1.08)}90%{transform:rotate(5deg) scale(1.1);filter:brightness(1.4)}100%{transform:rotate(0) scale(1.12);filter:brightness(2)}}
.ouverture.dechire .ouv-pack{animation:eclate .4s forwards}
@keyframes eclate{to{transform:scale(1.6);opacity:0;filter:brightness(3) blur(4px)}}
.ouv-cartes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.flip{width:150px;aspect-ratio:5/7;perspective:900px;cursor:pointer;animation:sortCarte .6s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--d) * .12s);position:relative}
@media (max-width:520px){.ouv-cartes{gap:6px}.flip{width:31vw}.flip .myc{--w:31vw !important}}
@keyframes sortCarte{from{transform:translateY(120px) scale(.4) rotate(calc((var(--d) - 1) * 20deg));opacity:0}}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.flip.ouverte .flip-in{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f-avant{transform:rotateY(180deg)}
.flip:not(.ouverte):hover .flip-in{transform:rotateY(12deg) translateY(-4px)}
.nouv{position:absolute;bottom:-12px;top:auto;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:3px 10px;background:var(--or-grad);color:var(--noir);font-weight:500;white-space:nowrap;z-index:2}
.ouv-txt{position:relative;z-index:1;font-family:var(--f-display);font-size:20px;color:var(--champagne);text-align:center;min-height:1.4em}
.ouv-btns{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:fondu .5s}
.ouverture.ambiance .flip.ouverte{animation:flotte 3.2s ease-in-out infinite;animation-delay:calc(var(--d) * .4s)}
@keyframes flotte{50%{transform:translateY(-8px)}}
.ouv-etincelles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ouv-etincelles i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--champagne);box-shadow:0 0 8px var(--or);animation:monteE linear infinite}
@keyframes monteE{to{transform:translateY(-105vh);opacity:0}}
.particule{position:fixed;z-index:80;width:7px;height:7px;border-radius:50%;pointer-events:none;box-shadow:0 0 8px currentColor}
.flash-ecran{position:fixed;inset:0;z-index:79;pointer-events:none;background:radial-gradient(circle,rgba(255,230,160,.8),transparent 70%);animation:flash .7s forwards}
.flash-ecran.m{background:radial-gradient(circle,rgba(255,170,240,.85),rgba(140,230,255,.4) 40%,transparent 75%)}
@keyframes flash{from{opacity:1}to{opacity:0}}

/* Collection */
.my-coll-t{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:22px}
.my-coll-t svg{width:26px;height:26px}
.my-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;justify-items:center}
.fiche-my{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:560px){.fiche-my{grid-template-columns:1fr;justify-items:center}.fiche-my .myc{--w:200px !important}}
.my-paliers.mini{padding:10px;gap:6px}
.my-paliers .fait .my-pal-b{opacity:.35}
.my-paliers .actuel .my-pal-b{box-shadow:0 0 22px var(--or);animation:pulse 1.6s infinite}
.my-paliers .actuel strong{color:var(--or)}

/* Roue */
.roue-scene{display:grid;justify-items:center;gap:16px}
.roue-cadre{position:relative;width:min(340px,86vw)}
.roue-my{width:100%;height:auto;filter:drop-shadow(0 25px 40px rgba(0,0,0,.7))}
.roue-g{transform-origin:center;transform-box:fill-box}
.ampoule-r{animation:ampoule 1.2s infinite}
.fleche-r.grande{top:-14px;border-left-width:14px;border-right-width:14px;border-top-width:28px}
.roue-res{font-family:var(--f-display);font-size:24px;color:var(--champagne);min-height:1.4em;text-align:center}

/* Quêtes */
.q-entete{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.q-hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:440px;margin:0 auto 8px}
.q-hud span{text-align:center;padding:6px;border:1px solid rgba(var(--or-rgb),.3);background:rgba(8,8,8,.6)}
.q-hud i{display:block;font-style:normal;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--or)}
.q-hud b{font-family:var(--f-display);font-size:24px;font-weight:500;color:var(--champagne);font-variant-numeric:tabular-nums}
.q-zone{position:relative;max-width:440px;margin:0 auto;border:2px solid rgba(var(--or-rgb),.5);box-shadow:0 20px 50px -20px rgba(0,0,0,.9);line-height:0}
.q-zone canvas{display:block;width:100%}
.q-fin{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,5,5,.6);line-height:1.5}
.q-fin.vis{display:grid;animation:fondu .4s}
.q-bilan{text-align:center;padding:24px;border:1px solid var(--or);background:rgba(12,11,14,.95);animation:apparait .5s cubic-bezier(.2,1.4,.4,1)}
.q-commandes{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.manette{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.manette button{height:54px;border:1px solid rgba(var(--or-rgb),.45);background:rgba(12,11,14,.9);color:var(--champagne);font-size:22px;cursor:pointer;border-radius:8px;transition:transform .1s,background .2s;-webkit-tap-highlight-color:transparent}
.manette button:active{transform:scale(.92);background:rgba(var(--or-rgb),.25)}
.manette .centre{background:var(--or-grad);color:var(--noir);font-size:18px}
.q-options{display:grid;gap:8px}
.q-options .case-l{margin:0}

/* Duel */
.arene{position:relative;margin-top:6px;border:2px solid rgba(var(--or-rgb),.5);border-radius:12px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--a1) 35%,#0a0a0a),#0c0b0e 45%,#0c0b0e 55%,color-mix(in srgb,var(--a1) 35%,#0a0a0a));padding:12px 12px 10px}
.arene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--a2) 18%,transparent),transparent 40%),radial-gradient(circle at 80% 85%,color-mix(in srgb,var(--a2) 18%,transparent),transparent 40%);pointer-events:none}
.arene-nom{position:absolute;top:8px;right:12px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--a2);opacity:.85;z-index:1}
.tour-zone{position:relative;display:flex;align-items:center;gap:12px;z-index:1}
.tour-svg{width:56px;height:64px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6));transform-origin:bottom}
.tour-svg.effondre{animation:effondre 1.6s forwards}
@keyframes effondre{30%{transform:rotate(-4deg)}60%{transform:translateY(10px) rotate(6deg) scaleY(.8);opacity:.8}100%{transform:translateY(30px) rotate(12deg) scaleY(.3);opacity:0;filter:blur(2px)}}
.tour-zone.secoue{animation:secoueT .45s}
@keyframes secoueT{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.tour-info{flex:1;min-width:0}
.tour-info b{font-family:var(--f-display);font-size:18px;font-weight:500;color:var(--champagne)}
.pv{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin:4px 0}
.pv span{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#c62828,#ff7043 40%,#ffd54f);transition:width .6s}
.pv em{position:relative;display:block;text-align:center;font-style:normal;font-family:var(--f-mono);font-size:10.5px;line-height:14px;color:#fff;text-shadow:0 1px 2px #000}
.elixir{display:flex;align-items:center;gap:3px}
.elixir i{flex:1;max-width:16px;height:7px;border-radius:4px;background:rgba(255,255,255,.1)}
.elixir i.plein{background:linear-gradient(90deg,#c74bff,#ff6ad5);box-shadow:0 0 6px rgba(220,100,255,.7)}
.elixir b{font-family:var(--f-mono);font-size:11px;color:#e9b6ff;margin-left:4px}
.adv-main{display:flex;gap:4px;justify-content:flex-end;margin:6px 0 0;position:relative;z-index:1}
.riviere{position:relative;margin:10px -12px;padding:12px;min-height:150px;display:grid;place-items:center;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--a3) 30%,transparent) 30%,color-mix(in srgb,var(--a3) 45%,transparent) 50%,color-mix(in srgb,var(--a3) 30%,transparent) 70%,transparent);z-index:1}
.riviere::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 18px,transparent 18px 34px);animation:courant 2.5s linear infinite;opacity:.5}
@keyframes courant{to{background-position:68px 0}}
.centre-zone{position:relative;z-index:2;text-align:center}

      let d = c.toDataURL("image/jpeg", q);
      if (d.length > 190000) d = c.toDataURL("image/jpeg", .5);
      if (d.length > 190000) { const c2 = document.createElement("canvas"); c2.width = Math.round(w * .7); c2.height = Math.round(h * .7); c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height); d = c2.toDataURL("image/jpeg", .55); }
      URL.revokeObjectURL(url); res(d);

    img.src = url;
  });
}

function carteProfil(p) {
  const j = J(p), xp = j.xp || 0, n = niveau(xp), a = seuil(n), b = seuil(n + 1);
  const pct = Math.max(2, Math.min(100, ((xp - a) / (b - a)) * 100));
  const succes = Object.keys(K().succes || {}).length;
  return `<div class="profil"><div class="haut"><span class="avatar">${esc(initiale(p))}</span><div><div class="nv">NIVEAU ${n}</div><div class="titre">${esc(titre(n))}</div><div class="nom">${esc(nom(p))}</div></div></div>
    <div class="xp"><b style="width:${pct}%"></b></div><div class="xp-l"><span>${fmt(xp)} XP</span><span>niveau ${n + 1} à ${fmt(b)} XP</span></div>
    <div class="stats"><div><strong>${j.parties || 0}</strong><span>Parties</span></div><div><strong>${succes}/51</strong><span>Succès</span></div><div><strong>${serieQDJ(p)}</strong><span>Série QDJ</span></div>
    <div><strong>${fmt(gc(p))}</strong><span>GC</span></div><div><strong>${j.cles || 0}</strong><span>Clés</span></div><div><strong>${j.victoiresJeux || 0}</strong><span>Victoires</span></div></div></div>`;
}

/* ═══════════ QUESTION DU JOUR ═══════════ */
const TOUTES_Q = (() => { const l = []; QDJ_CATS.forEach(c => c.q.forEach(q => l.push({ c: c.nom, q }))); const r = mulberry(20261118); for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; })();
const questionDu = d => TOUTES_Q[((numJour(d) % TOUTES_Q.length) + TOUTES_Q.length) % TOUTES_Q.length];
function serieQDJ(p) {
  const q = K().qdj || {}; let n = 0; const d = new Date();
  if (!(q[jour(d)] && q[jour(d)][p])) d.setDate(d.getDate() - 1);
  while (q[jour(d)] && q[jour(d)][p]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
V.question = {
  html() {
    const m = moi || "p1", o = autre(m), aujd = jour();
    const Q = questionDu(new Date());
    const rep = (K().qdj || {})[aujd] || {};

    for (let i = 1; i <= 6; i++) { const d = new Date(); d.setDate(d.getDate() - i); const r = (K().qdj || {})[jour(d)]; if (r && (r.p1 || r.p2)) archives.push({ d, Q: questionDu(d), r }); }
    return `${retour("univers", "Notre univers")}${entete("Question du jour", "Une question, <em>deux réponses</em>", "150 questions de couple en 6 catégories. 30 XP par réponse, 20 XP de bonus chacun quand vous répondez tous les deux, et une récompense tous les 7 jours de suite.")}
      <div class="qdj"><span class="pastille">${esc(Q.c)}</span><blockquote>${esc(Q.q)}</blockquote><p class="muted petit">${new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })} · ta série : ${serieQDJ(m)} jour${serieQDJ(m) > 1 ? "s" : ""}</p></div>
      <div class="pile" style="margin-top:16px">
        ${rep[m] ? `<div class="reponse"><small>Ta réponse</small><p>${esc(rep[m])}</p></div>` : `<form id="f" class="vitrine"><div class="champ"><label for="r">Ta réponse</label><textarea id="r" required maxlength="1500"></textarea></div><button class="btn">Répondre · +30 XP</button></form>`}
        ${rep[o] ? (rep[m] ? `<div class="reponse"><small>Réponse de ${esc(nom(o))}</small><p>${esc(rep[o])}</p></div>` : `<div class="vide">${esc(nom(o))} a déjà répondu. Réponds pour découvrir sa réponse.</div>`) : `<div class="vide">${esc(nom(o))} n'a pas encore répondu.</div>`}
      </div>
      ${archives.length ? `<h3 style="margin:30px 0 12px">Les jours précédents</h3><div class="liste">${archives.map(a => `<div class="vitrine"><p class="surtitre">${a.d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}</p><h3 style="margin:6px 0 10px">${esc(a.Q.q)}</h3>${["p1", "p2"].map(p => a.r[p] ? `<p class="petit"><b style="color:var(--or);font-weight:400">${esc(nom(p))} :</b> ${a.r[m] || p === m ? esc(a.r[p]) : "<i class='muted'>réponds ce jour-là pour voir</i>"}</p>` : "").join("")}</div>`).join("")}</div>` : ""}`;
  },
  mount(el) {
    const f = $("#f", el); if (!f) return;
    f.onsubmit = e => {
      e.preventDefault();
      if (!exigerMoi()) return;
      const txt = $("#r", el).value.trim(); if (!txt) return;
      const aujd = jour(), r0 = (K().qdj || {})[aujd] || {};
      if (r0[moi]) return;
      PK({ qdj: { [aujd]: { [moi]: txt } } });
      stat("qdj"); gagnerXP(moi, 30);
      let msg = "+30 XP";
      if (r0[autre(moi)]) { gagnerXP(moi, 20); gagnerXP(autre(moi), 20); stat("qdj_deux"); msg += " · bonus à deux +20 XP chacun"; }

/* xii. Puissance 4 (même téléphone, à deux ou contre l'ordi) */
const P4C = 7, P4L = 6;
function p4Gagne(g, j) {
  for (let r = 0; r < P4L; r++) for (let c = 0; c < P4C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const l = []; for (let k = 0; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= P4L || cc < 0 || cc >= P4C || g[rr * P4C + cc] !== j) break; l.push(rr * P4C + cc); }
    if (l.length === 4) return l;
  }
  return null;
}
const p4Ligne = (g, c) => { for (let r = P4L - 1; r >= 0; r--) if (!g[r * P4C + c]) return r; return -1; };
function p4Score(g, j, o) {
  let s = 0;
  for (let r = 0; r < P4L; r++) if (g[r * P4C + 3] === j) s += 3;
  for (let r = 0; r < P4L; r++) for (let c = 0; c < P4C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    let mj = 0, mo = 0, ok = true;
    for (let k = 0; k < 4; k++) { const rr = r + dr * k, cc = c + dc * k; if (rr < 0 || rr >= P4L || cc < 0 || cc >= P4C) { ok = false; break; } const v = g[rr * P4C + cc]; if (v === j) mj++; else if (v === o) mo++; }
    if (!ok) continue;
    if (mj && !mo) s += mj === 3 ? 6 : mj === 2 ? 2 : 0;
    if (mo && !mj) s -= mo === 3 ? 8 : mo === 2 ? 2 : 0;
  }
  return s;
}
function p4Minimax(g, prof, a, b, max, j, o) {

        const f = $("form", zc);
        if (f) f.onsubmit = e => { e.preventDefault(); const i = $("input", f); const v = i.value.trim(); if (!v) return; const S2 = partie(id); if (S2 && S2.etat === "jeu") champ.envoyer(S2, v); i.value = ""; };
      }
      if (def.apres) def.apres(S, el);
    }
  };
}
function actionsDuo(id) {
  const def = DUO[id];
  const base = {
    inviter() { const S = def.init(); S.etat = "attente"; S.hote = moi; S.cree = Date.now(); ecrirePartie(id, S); },
    annuler() { majPartie(id, { etat: "annule" }); },
    rejoindre() { const S = partie(id); if (!invitationValide(S)) return; majPartie(id, { etat: "jeu", debut: Date.now() }); },
    quitter() { confirmer("Abandonner la partie en cours ?", () => majPartie(id, { etat: "annule" }), "Abandonner"); }
  };
  const res = {};
  Object.keys(base).forEach(k => res[k] = base[k]);
  Object.keys(def.actions || {}).forEach(k => res[k] = (v, b) => { const S = partie(id); if (S && S.etat === "jeu") def.actions[k](S, v, b); });
  return res;
}
function terminer(id, S, gagnant, extra) {
  const gain = finPartie(id, gagnant, extra);
  ecrirePartie(id, Object.assign({}, S, { etat: "fin", gagnant: gagnant || null, gain: gain.replace(/<[^>]+>/g, "") }));
}
const duoScores = (sc, tour) => scoresHTML(sc || { p1: 0, p2: 0 }, tour);
const attente = p => `<p class="consigne" style="font-size:19px;color:var(--gris)"><span class="led orange" style="display:inline-block;margin-right:8px"></span>${esc(nom(p))} réfléchit…</p>`;
const resGagnant = S => S.gagnant ? esc(nom(S.gagnant)) + " gagne" : "Égalité";

/* i. Mémoire */
const SYM_MEMO = ["♠", "♥", "♦", "♣", "★", "☾", "♛", "✦"];
vueDuo("memoire", {
  init: () => ({ cartes: melanger(SYM_MEMO.concat(SYM_MEMO)), ok: [], vus: [], tour: rnd(2) ? "p1" : "p2", sc: { p1: 0, p2: 0 }, attente: 0 }),
  rendu: S => `${duoScores(S.sc, S.etat === "jeu" ? S.tour : null)}<p class="consigne">${S.etat === "jeu" ? (S.tour === moi ? "À toi de retourner deux cartes" : "Au tour de " + esc(nom(S.tour))) : ""}</p>
    <div class="memo">${S.cartes.map((c, i) => `<button data-a="c" data-v="${i}" class="${(S.vus || []).includes(i) ? "vu" : ""} ${(S.ok || []).includes(i) ? "ok" : ""}" aria-label="Carte ${i + 1}"><span class="d"></span><span class="f ${c === "♥" || c === "♦" ? "rg" : ""}">${c}</span></button>`).join("")}</div>`,
  resultat: S => resGagnant(S) + ` · ${S.sc.p1} à ${S.sc.p2}`,
  actions: {
    c(S, v) {
      const i = +v, vus = S.vus || [], ok = S.ok || [];
      if (S.tour !== moi || vus.length >= 2 || ok.includes(i) || vus.includes(i)) return;
      const n = vus.concat([i]);
      if (n.length < 2) { majPartie("memoire", { vus: n }); return; }
      if (S.cartes[n[0]] === S.cartes[n[1]]) {
        const ok2 = ok.concat(n), sc = Object.assign({}, S.sc, { [moi]: S.sc[moi] + 1 });
        const S2 = Object.assign({}, S, { ok: ok2, vus: [], sc });
        if (ok2.length === S.cartes.length) terminer("memoire", S2, gagnantDe(sc)); else ecrirePartie("memoire", S2);
      } else majPartie("memoire", { vus: n, attente: Date.now() });
    }
  },
  apres(S) {
    if (!S || S.etat !== "jeu" || !S.attente || (S.vus || []).length < 2) return;
    const age = Date.now() - S.attente, delai = S.tour === moi ? 1100 : 3000;
    clearTimeout(DUO.memoire._t);
    DUO.memoire._t = setTimeout(() => { const S2 = partie("memoire"); if (S2 && S2.attente === S.attente && (S2.vus || []).length >= 2) majPartie("memoire", { vus: [], attente: 0, tour: autre(S2.tour) }); }, Math.max(0, delai - age));
  }
});

/* ii. Devinettes */
vueDuo("devinettes", {
